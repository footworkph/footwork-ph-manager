<style>
:root{
  --bg:#F7F5F9; --surface:#FFFFFF; --ink:#16101C; --muted:#655C70; --line:#E3DDE8;
  --pink:#E8157F; --pink-ink:#FFFFFF; --lime:#8ACB17; --lime-ink:#16101C; --good:#11834F; --bad:#C62D3F; --soft:#F1ECF4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0B13; --surface:#1B1521; --ink:#F6F1F8; --muted:#AFA5B8; --line:#322839;
    --pink:#FF3C9D; --pink-ink:#140F18; --lime:#9BE22D; --lime-ink:#140F18; --good:#46D38F; --bad:#FF6B7C; --soft:#261E2D;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0B13; --surface:#1B1521; --ink:#F6F1F8; --muted:#AFA5B8; --line:#322839;
  --pink:#FF3C9D; --pink-ink:#140F18; --lime:#9BE22D; --lime-ink:#140F18; --good:#46D38F; --bad:#FF6B7C; --soft:#261E2D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:22px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
a{color:var(--pink)}
.wrap{max-width:880px;margin:0 auto;padding:12px 16px 110px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
header.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
header.top img{width:48px;height:48px;border-radius:50%}
header.top p{margin:0;color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.banner{display:block;width:100%;max-width:100%;height:auto;border-radius:14px;margin-bottom:14px;aspect-ratio:1200/446;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:flex;max-width:880px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 64px;background:none;border:0;padding:9px 2px 11px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--pink);color:var(--pink-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px;text-align:left}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:500}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.money{font-variant-numeric:tabular-nums}
.split{margin:6px 0 4px}
.split .bar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--soft)}
.split .bar div{display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:13px;white-space:nowrap;min-width:0}
.split .inst{background:var(--lime);color:var(--lime-ink)}
.split .biz{background:var(--pink);color:var(--pink-ink);flex:1}
.split .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger td{padding:7px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ledger tr.sum td{font-weight:800;border-bottom:0}
.ledger tr.sub td{color:var(--muted);font-size:13px;padding-top:0}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:12px 0}
.list li:first-child{border-top:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--lime) 30%,transparent);color:var(--ink)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.pink{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* week calendar */
.wk{display:grid;gap:10px;margin-bottom:14px}
@media (min-width:900px){.wk{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.wkday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wkday.today{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.wkh{display:flex;align-items:baseline;gap:8px}
.wkh .dw{font-weight:800;font-style:italic;font-size:13px;letter-spacing:.5px;color:var(--ink)}
.wkh .dw.we{color:var(--pink)}
.wkh .dn{font-weight:800;font-size:13px;color:var(--muted)}
.wkc{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.wkc:hover{border-color:var(--pink)}
.wkc .tm{display:block;font-size:12px;font-weight:800;color:var(--pink)}
.wkc b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.wkc .sub{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.wkadd{width:100%;margin-top:auto;min-height:40px}
.wkbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rcp{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rcp:last-child{border-bottom:0}
.rcp input{width:20px;height:20px;flex:none;accent-color:var(--pink)}

function seedRatesV2(st){
  const T = st.classTypes, find = (id, rx) => T.find(t=>t.id===id) || T.find(t=>rx.test(t.name||""));
  const zumba = find("ct_zumba", /^zumba$/i), kids = find("ct_7pctyxtt", /kid/i), free = find("ct_934y5mll", /free/i);
  const group = [find("ct_aero",/aero/i), find("ct_hiphop",/hip\s*hop/i), find("ct_brqsz6r2",/k-?pop/i), find("ct_pr9myfhj",/femme/i)].filter(Boolean);
  if(!T.length) return;
  st.rates.nonMember.reg = 350; st.rates.member.reg = 300;
  if(st.promo && st.promo.ends === "2026-11-21") st.promo.ends = "2026-11-20";
  if(zumba) Object.assign(zumba,{nonRate:200, memRate:150});
  if(kids) Object.assign(kids,{nonRate:250, memRate:200});
  if(free) free.free = true;
  const ids = a => a.filter(Boolean).map(t=>t.id);
  const add = (key, name, f, types, price) => { if(!st.plans.some(p=>p.seed===key)) st.plans.push({id:"pl_"+key, seed:key, name, for:f, typeIds:ids(types), price, promoPrice:"", sessions:5, days:30}); };
  add("grp_non","5 Sessions · Aero/Hip Hop/K-Pop/Femme (Non-member)","nonmember",group,1500);
  add("grp_mem","5 Sessions · Aero/Hip Hop/K-Pop/Femme (Member)","member",group,1250);
  add("zum_non","5 Sessions · Zumba (Non-member)","nonmember",[zumba],850);
  add("zum_mem","5 Sessions · Zumba (Member)","member",[zumba],650);
  add("kid_non","5 Sessions · Kids Dance (Non-member)","nonmember",[kids],1100);
  add("kid_mem","5 Sessions · Kids Dance (Member)","member",[kids],900);
  st.ratesV2 = true;
}
function normalize(d){
  d = d || {};
  const o = {};
  LISTS.forEach(k=>{ o[k] = Array.isArray(d[k]) ? d[k] : []; });
  const ds = d.settings || {};
  const st = Object.assign(structuredClone(DEFAULT.settings), ds);
  st.rates = Object.assign(structuredClone(DEFAULT.settings.rates), ds.rates||{});
  if(ds.dropInRate!=null && !ds.rates) st.rates.nonMember.reg = +ds.dropInRate||0;
  delete st.dropInRate;
  st.rental = Object.assign({hour:400, extHour:300}, ds.rental||{});
  st.promo = Object.assign({active:false,ends:""}, ds.promo||{});
  if(!Array.isArray(ds.classTypes)) st.classTypes = structuredClone(DEFAULT_TYPES);
  if(!st.categories.includes("Merchandise")) st.categories.splice(Math.max(0,st.categories.length-1),0,"Merchandise");
  st.plans = (st.plans||[]).map(p=>Object.assign({promoPrice:"", for:"member", typeIds:[]},p));
  if(!st.ratesV2) seedRatesV2(st);
  st.instructors = (st.instructors||[]).map(i=>Object.assign({pct:"",min:"",contact:"",notes:"",types:[]},i));
  st.mail = Object.assign({url:"", key:"", sent:{}}, ds.mail||{}); if(!st.mail.sent || typeof st.mail.sent!=="object") st.mail.sent = {};
  o.settings = st;
  o.members = o.members.map(m=>Object.assign({type:"member"},m));
  o.members.forEach(m=>{ if(m.type==="member" && !m.memberNo) m.memberNo = nextMemberNo(o.members); });
  o.sessions = o.sessions.map(s=>Object.assign({instStatus:"present",paidOut:false,pctOverride:"",attendees:[],typeId:""},s));
  return o;
}

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  lsSet(LS_DIRTY,"1");
  const seq = ++saveSeq;
  if(!sb || !sbUser){ setSync("Offline. Saved on this device."); return; }
  pendingSave = true; setSync("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>flush(seq), 600);
}
function flush(seq){
  saveTimer = null;
  return cloudPush().then(()=>{
    if(seq===saveSeq){ pendingSave=false; lsSet(LS_DIRTY,""); setSync("Synced"); }
  }).catch(()=>{
    if(seq===saveSeq){ pendingSave=false; setSync("Offline. Saved on this device."); }
  });
}

function clearLocal(){ [LS_KEY,LS_DIRTY,LS_STAMP,LS_OWNER].forEach(k=>lsSet(k,"")); S = structuredClone(DEFAULT); }

/* one upload at a time, always sending the newest records */
function cloudPush(){
  const run = async ()=>{
    const r = await sb.from(SB_TABLE).upsert({owner: sbUser.id, data: JSON.parse(JSON.stringify(S))}, {onConflict:"owner"}).select("updated_at").single();
    if(r.error) throw r.error;
    lsSet(LS_STAMP, r.data.updated_at);
  };
  pushChain = pushChain.then(run, run);
  return pushChain;
}
async function cloudPull(){
  const r = await sb.from(SB_TABLE).select("data,updated_at").eq("owner", sbUser.id).maybeSingle();
  if(r.error) throw r.error;
  if(!r.data) return false;
  S = normalize(r.data.data);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  lsSet(LS_STAMP, r.data.updated_at); lsSet(LS_DIRTY,"");
  render();
  return true;
}
/* compare this device with the account, then upload or download */
async function syncNow(manual){
  if(!sb || !sbUser || syncing || pendingSave || dlg.open) return false;
  syncing = true;
  try{
    const head = await sb.from(SB_TABLE).select("updated_at").eq("owner", sbUser.id).maybeSingle();
    if(head.error) throw head.error;
    const cloudStamp = head.data ? head.data.updated_at : "";
    const changedElsewhere = !!cloudStamp && cloudStamp !== lsGet(LS_STAMP);
    if(pendingSave || dlg.open){ /* the person started editing while we checked: leave it for the next round */ }
    else if(!cloudStamp){ await cloudPush(); lsSet(LS_DIRTY,""); }
    else if(isDirty()){
      const keepLocal = !changedElsewhere || confirm("This device has records that are not synced yet, and your account has newer records from another device.\n\nOK = keep this device's records.\nCancel = load the records from your account.");
      if(keepLocal){ const seq = saveSeq; await cloudPush(); if(seq===saveSeq) lsSet(LS_DIRTY,""); }
      else await cloudPull();
    }
    else if(changedElsewhere) await cloudPull();
    if(!pendingSave) setSync("Synced");
    if(manual) toast("Synced");
    return true;
  }catch(e){
    if(!pendingSave) setSync("Offline. Saved on this device.");
    if(manual) toast("Can't sync right now. Check your internet.");
    return false;
  }finally{ syncing = false; }
}

async function syncTick(manual){ const ok = await syncNow(manual); autoLapse(); if(ok) await importFormInbox(); loadBookings(); return ok; }

/* ---------- Google Form registrations -> students (one record per contact number or email) ---------- */
let importing = false;
function formInterestIds(list){
  const types = S.settings.classTypes || [], ids = [];
  const pick = re => { const t = types.find(x=>re.test(x.name||"")); if(t && !ids.includes(t.id)) ids.push(t.id); };
  (list||[]).forEach(raw=>{
    const s = String(raw).toLowerCase();
    if(s.includes("aero")) pick(/aero/i);
    else if(s.includes("zumba")) pick(/^zumba$/i);
    else if(s.includes("kid")) pick(/kid/i);
    else if(s.includes("hip")) pick(/hip\s*hop/i);
    else if(s.includes("k-pop") || s.includes("kpop")) pick(/k-?pop/i);
    else if(s.includes("femme")) pick(/femme/i);
    else { const t = types.find(x=>(x.name||"").toLowerCase()===s); if(t && !ids.includes(t.id)) ids.push(t.id); }
  });
  return ids;
}
function mergeFormRow(r){
  const digits = v => String(v||"").replace(/\D/g,"").slice(-10);
  const ph = digits(r.contact), em = String(r.email||"").trim().toLowerCase();
  const m = S.members.find(x=>(ph.length===10 && digits(x.contact)===ph) || (em && String(x.email||"").trim().toLowerCase()===em));
  const day = todayISO();
  const extra = [r.fb && "FB: "+r.fb, r.viber && !/^same$/i.test(r.viber) && digits(r.viber)!==ph && "Viber: "+r.viber, r.address && "Address: "+r.address]
    .filter(Boolean).filter(t=>!(m && (m.notes||"").includes(t)));
  const ints = formInterestIds(r.interests);
  const otherInts = (r.interests||[]).filter(x=>!formInterestIds([x]).length && !/studio rental/i.test(x));
  if(m){
    const lines = [];
    if(r.contact){ if(!digits(m.contact)) m.contact = r.contact; else if(ph && digits(m.contact)!==ph && !(m.notes||"").includes(r.contact)) lines.push("Other number: "+r.contact); }
    if(em){ const old = String(m.email||"").trim().toLowerCase(); if(!old) m.email = r.email; else if(old!==em && !(m.notes||"").includes(r.email)) lines.push("Other email: "+r.email); }
    if(r.birthday && !m.birthday) m.birthday = r.birthday;
    m.interests = [...new Set([...(m.interests||[]), ...ints])];
    if(r.name && r.name.trim().toLowerCase()!==String(m.name||"").trim().toLowerCase()) lines.push(`Also registered as "${r.name}"`);
    if(otherInts.length) lines.push("Interested in: "+otherInts.join(", "));
    lines.push(...extra);
    if(lines.length) m.notes = [m.notes, `Google Form update ${day}: `+lines.join(" · ")].filter(Boolean).join("\n");
    return formPaid(m, r) || "updated";
  }
  const nm = {id:uid(), type:"nonmember", name:r.name, contact:r.contact||"", email:r.email||"", birthday:r.birthday||"",
    ecName:"", ecNo:"", interests:ints, planId:"", planType:"", startDate:day, paid:0, paidDate:"",
    notes:[`Registered via Google Form (${day})`, ...extra, otherInts.length && "Interested in: "+otherInts.join(", "),
      r.signup==="Member" && !r.paid && "Applied as member on the form. Not paid yet."].filter(Boolean).join("\n")};
  S.members.push(nm);
  return formPaid(nm, r) || "added";
}
/* "Payment verified" ticked in the sheet: make them a member with the next member no. */
function formPaid(m, r){
  if(!r.paid) return "";
  const from = r.paid_on || todayISO();
  if(m.type==="member" && !cardExpired(m)) return "";   /* already an active member: nothing to change */
  joinMembership(m, r.fee!=null && r.fee!=="" ? r.fee : rate("membershipFee"), from);
  m.feeDate = from;
  const pay = [r.pay_method, r.pay_ref && "Ref "+r.pay_ref].filter(Boolean).join(" · ");
  m.notes = [m.notes, `Payment verified ${from}${pay?" ("+pay+")":""}. Now member ${m.memberNo}.`].filter(Boolean).join("\n");
  return "joined";
}
async function importFormInbox(){
  if(!sb || !sbUser || importing || pendingSave || dlg.open) return;
  importing = true;
  try{
    const q = await sb.from("fw_form_inbox").select("id,name,contact,viber,email,fb,birthday,address,interests,signup,paid,fee,pay_method,pay_ref,paid_on")
      .is("imported_at", null).order("created_at").limit(100);
    if(q.error || !q.data || !q.data.length) return;
    let added = 0, updated = 0, joined = 0;
    q.data.forEach(r=>{ const k = mergeFormRow(r); if(k==="added") added++; else if(k==="joined") joined++; else updated++; });
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
    lsSet(LS_DIRTY,"1");
    await cloudPush(); lsSet(LS_DIRTY,"");
    await sb.from("fw_form_inbox").update({imported_at:new Date().toISOString()}).in("id", q.data.map(r=>r.id));
    if(!dlg.open) render();
    toast("Google Form: "+[added && `${added} new student${added===1?"":"s"}`, joined && `${joined} new member${joined===1?"":"s"}`, updated && `${updated} updated`].filter(Boolean).join(", "));
  }catch(e){ /* try again on the next sync */ }
  finally{ importing = false; }
}

/* ---------- sign in ---------- */
const gate = document.getElementById("gate");
function gateMsg(t, ok){ const el=document.getElementById("gMsg"); el.textContent=t||""; el.classList.toggle("ok", !!ok); }
function gateBusy(on){ document.getElementById("gIn").disabled=on; document.getElementById("gUp").disabled=on; }
function showGate(msg){
  document.getElementById("gateLogo").src = document.querySelector("header.top img").src;
  document.querySelector(".wrap").inert = true; document.querySelector("nav.tabs").inert = true;
  document.getElementById("gPass").value = "";
  const ge = document.getElementById("gEmail"); if(ge && !ge.value) ge.value = STUDIO_EMAIL;
  gateMsg(msg||""); gateBusy(false); gate.hidden = false;
}
function hideGate(){
  gate.hidden = true;
  document.querySelector(".wrap").inert = false; document.querySelector("nav.tabs").inert = false;
}
function authText(err){
  const m = String((err && err.message) || "").toLowerCase();
  if(m.includes("invalid login")) return "Wrong email or password.";
  if(m.includes("not confirmed")) return "Confirm your email first. Open the link sent to your inbox, then sign in.";
  if(m.includes("already registered") || m.includes("already been registered")) return "This email already has an account. Tap Sign in.";
  if(m.includes("signups not allowed") || m.includes("signup is disabled") || m.includes("signups are disabled")) return "New accounts are turned off. Sign in with your existing account.";
  if(m.includes("rate limit") || m.includes("too many") || m.includes("security purposes")) return "Too many tries. Wait a minute, then try again.";
  if(m.includes("fetch") || m.includes("network")) return "Can't reach the server. Check your internet, then try again.";
  if(m.includes("password")) return "Use a password with at least 6 characters.";
  return (err && err.message) ? err.message : "Something went wrong. Try again.";
}
function gateFields(){
  const email = document.getElementById("gEmail").value.trim(), password = document.getElementById("gPass").value;
  if(!email || !email.includes("@")){ gateMsg("Enter your email."); return null; }
  if(password.length < 6){ gateMsg("Use a password with at least 6 characters."); return null; }
  return {email, password};
}
async function doSignIn(){
  const f = gateFields(); if(!f) return;
  gateBusy(true); gateMsg("Signing in…", true);
  try{
    const r = await sb.auth.signInWithPassword(f);
    if(r.error || !r.data.user){ gateMsg(authText(r.error)); gateBusy(false); return; }
    await startSignedIn(r.data.user);
  }catch(e){ gateMsg(authText(e)); gateBusy(false); }
}
async function doSignUp(){
  const f = gateFields(); if(!f) return;
  gateBusy(true); gateMsg("Creating your account…", true);
  try{
    const r = await sb.auth.signUp({email:f.email, password:f.password, options:{emailRedirectTo: location.origin + location.pathname}});
    if(r.error){ gateMsg(authText(r.error)); gateBusy(false); return; }
    if(r.data.session && r.data.user){ await startSignedIn(r.data.user); return; }
    if(r.data.user && Array.isArray(r.data.user.identities) && !r.data.user.identities.length){ gateMsg("This email already has an account. Tap Sign in."); gateBusy(false); return; }
    gateMsg("Account created. Open the confirm link sent to your email, then sign in here.", true); gateBusy(false);
  }catch(e){ gateMsg(authText(e)); gateBusy(false); }
}
async function startSignedIn(user){
  sbUser = user;
  const owner = lsGet(LS_OWNER);
  if(owner && owner !== user.id) clearLocal();
  lsSet(LS_OWNER, user.id);
  let had = false;
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const d = JSON.parse(raw); had = hasRecords(d); S = normalize(d); } }catch(e){}
  /* records typed before sync existed count as not synced yet */
  if(had && !lsGet(LS_STAMP)) lsSet(LS_DIRTY,"1");
  hideGate(); render(); setSync("Syncing…");
  await syncTick();
  clearInterval(syncTimer);
  syncTimer = setInterval(()=>{ if(!document.hidden) syncTick(); }, 45000);
}
function lockApp(){
  sbUser = null; clearInterval(syncTimer); clearTimeout(saveTimer); saveTimer = null; pendingSave = false;
  if(dlg.open) dlg.close();
  if(isDirty()) S = structuredClone(DEFAULT); else clearLocal();
  tab = "dash"; render(); setSync("Signed out"); showGate();
}
async function signOut(){
  if(isDirty()) await syncNow();
  if(isDirty() && !confirm("Some changes are not synced yet. They will stay on this device until you sign in again.\n\nSign out anyway?")) return;
  let failed = false;
  try{ const r = await sb.auth.signOut({scope:"local"}); failed = !!r.error; }catch(e){ failed = true; }
  if(failed) toast("Can't sign out while offline.");
}
function syncCard(){
  const who = sbUser ? `Signed in as <b>${esc(sbUser.email||"your account")}</b>. Your records sync to your account and open on any device you sign in to.` : `You are offline. Records are saved on this device and will sync when you are back online.`;
  return `<div class="card"><h3 style="margin-bottom:6px">Account and sync</h3>
    <p class="small muted" style="margin:0 0 10px">${who}</p>
    <div class="row"><button class="btn sm" data-sb="sync">Sync now</button><button class="btn sm ghost" data-sb="out">Sign out</button></div>
    <p class="small muted" style="margin:10px 0 0">Uploaded contract files stay on the device where you added them.</p></div>`;
}
async function init(){
  document.getElementById("gateForm").addEventListener("submit", e=>{ e.preventDefault(); doSignIn(); });
  document.getElementById("gUp").addEventListener("click", doSignUp);
  try{ sb = window.supabase.createClient(SB_URL, SB_KEY); }catch(e){ sb = null; }
  if(!sb){ render(); showGate("This browser can't open the sign-in. Update your browser, then try again."); return; }
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==="SIGNED_OUT"){ if(sbUser) setTimeout(lockApp, 0); }
    else if(session && session.user && sbUser && session.user.id===sbUser.id) sbUser = session.user;
  });
  let session = null, authErr = null;
  try{ const r = await sb.auth.getSession(); session = r.data ? r.data.session : null; authErr = r.error; }catch(e){ authErr = e; }
  if(session && session.user){ await startSignedIn(session.user); }
  else if(authErr && lsGet(LS_OWNER) && !navigator.onLine){
    /* offline with a saved sign-in: open this device's copy, sync later */
    try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = normalize(JSON.parse(raw)); }catch(e){}
    render(); autoLapse(); setSync("Offline. Saved on this device.");
    window.addEventListener("online", ()=>location.reload(), {once:true});
  }
  else { render(); showGate(); }
  window.addEventListener("online", ()=>syncTick());
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ if(saveTimer){ clearTimeout(saveTimer); flush(saveSeq); } }
    else syncTick();
  });
}

/* ---------- member card QR codes ---------- */
/* The QR holds a private card code only. No link, no name, no member number. */
const CARD_PREFIX = "FWPH:";
const cardCode = m => String(m.cardCode || m.id || "").toUpperCase();
const cardText = m => CARD_PREFIX + cardCode(m);
function newCardCode(){ const A="23456789ABCDEFGHJKLMNPQRSTUVWXYZ", b=new Uint8Array(10); crypto.getRandomValues(b); return Array.from(b, x=>A[x&31]).join(""); }
function qrCanvas(text, px){
  const q = qrcode(0, "Q");
  q.addData(text, /^[0-9A-Z $%*+\-./:]*$/.test(text) ? "Alphanumeric" : "Byte"); q.make();
  const n = q.getModuleCount(), quiet = 4, cell = Math.max(1, Math.floor(px/(n+quiet*2))), dim = cell*(n+quiet*2);
  const c = document.createElement("canvas"); c.width = c.height = dim;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,dim,dim); g.fillStyle = "#000";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+quiet)*cell, (r+quiet)*cell, cell, cell);
  return c;
}
const fileSafe = s => String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^\w.-]+/g,"-").replace(/^-+|-+$/g,"");
const qrFileName = m => [fileSafe(m.memberNo)||"member", fileSafe(m.name), "QR"].filter(Boolean).join("_")+".png";
const canvasBlob = c => new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("no image")), "image/png"));
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; (dlg.open ? dlg : document.body).appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function downloadQr(m){

  catch(e){ toast("Can't save the QR on this browser"); }
}
/* small ZIP writer (no compression) so all card QR codes download as one file */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = u => { let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c = CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function zipStore(files){
  const enc = new TextEncoder(), parts=[], cen=[]; let off=0;
  const d = new Date(), dd = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), dt = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  files.forEach(f=>{
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(10,dt,true); lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,nm.length,true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(12,dt,true); ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data); cen.push(new Uint8Array(ch.buffer), nm);
    off += 30+nm.length+sz;
  });
  const cenSize = cen.reduce((a,p)=>a+p.length,0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cenSize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], {type:"application/zip"});
}
async function downloadAllQr(){
  const mems = S.members.filter(m=>m.type==="member").sort((a,b)=>(a.memberNo||"").localeCompare(b.memberNo||"",undefined,{numeric:true}));

    downloadBlob(zipStore(files), "Footwork-PH_card-QR-codes_"+todayISO()+".zip");
    toast(mems.length+" QR code"+(mems.length===1?"":"s")+" saved to your downloads");
  }catch(e){ toast("Can't save the QR codes on this browser"); }
}

function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)){ res(); return; }
  const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
async function contractReady(box){
  try{ await document.fonts.ready; }catch(e){}
  await Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?null:new Promise(r=>{ i.onload=i.onerror=r; })));
}
const inAppBrowser = () => /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|Viber|TikTok|musical_ly|GSA\//i.test(navigator.userAgent||"");
function printNow(d){
  let box=document.getElementById("fwPrint");
  if(!box){ box=document.createElement("div"); box.id="fwPrint"; document.body.appendChild(box); }
  box.innerHTML = docPages(d);
  const prev=document.title; document.title=docFileName(d).replace(/\.pdf$/,"");
  document.body.classList.add("fw-printing");
  const done=()=>{ document.body.classList.remove("fw-printing"); document.title=prev; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  try{ window.print(); }catch(e){}
  setTimeout(()=>{ if(!matchMedia("print").matches) done(); },2000);
}
async function makeContractPdf(d){
  const box=document.createElement("div"); box.className="fwc-off"; box.innerHTML=docPages(d); document.body.appendChild(box);
  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
                       loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
    await contractReady(box);
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const pages=[...box.querySelectorAll(".fwc-page")];
    for(let i=0;i<pages.length;i++){
      const c=await window.html2canvas(pages[i],{scale:2.5,backgroundColor:"#ffffff",useCORS:true,logging:false});
      if(i) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297);
    }
    pdf.setProperties({title:docTitle(d)+" – "+(d.name||""),author:"Footwork PH"});
    return pdf.output("blob");
  } finally { box.remove(); }
}
function printContract(d){
  const host = (dlg && dlg.open) ? dlg : document.body;
  const old=document.getElementById("fwcOv"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="fwc-ov"; ov.id="fwcOv";
  const iab=inAppBrowser();
  const fname=docFileName(d);
  ov.innerHTML=`<div class="fwc-tb">
      <div class="row"><h3>${esc(d.docKind==="instr"?"Instructor agreement":d.docKind==="consent"?"Parent consent":d.docKind==="waiver"?"Waiver":"Contract")} · ${esc(d.name||"Member")}</h3><button type="button" class="btn sm ghost" data-v="close">✕ Close</button></div>
      ${iab?`<div class="fwc-warn"><b>You're in the Messenger (in-app) browser.</b> It blocks printing and downloads. Tap <b>•••</b> at the top right, then <b>Open in Safari</b> (or your browser). Then print from there.<div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-v="copy">Copy app link</button></div></div>`:""}
      <div class="row">
        <button type="button" class="btn sm" data-v="print">🖨 Print</button>
        <button type="button" class="btn sm ghost" data-v="save" disabled>Preparing PDF…</button>
        ${navigator.share?`<button type="button" class="btn sm ghost" data-v="share" disabled>Share / Print PDF</button>`:""}
      </div>
      <div class="small muted" id="fwcHint">${iab?"":"If Print does not open, use Share / Print PDF, then choose Print."}</div>
    </div>
    <div class="fwc-sc"><div class="fwc-zoom">${docPages(d)}</div></div>`;
  host.appendChild(ov);
  const zoom=ov.querySelector(".fwc-zoom"), sc=ov.querySelector(".fwc-sc");
  const fit=()=>{ const w=sc.clientWidth-24, z=Math.min(1, w/794); zoom.style.zoom=z; };
  fit(); window.addEventListener("resize",fit);
  let blob=null, url=null;
  const btn=v=>ov.querySelector(`[data-v="${v}"]`);
  makeContractPdf(d).then(b=>{ blob=b; url=URL.createObjectURL(b);
    const sv=btn("save"); if(sv){ sv.disabled=false; sv.textContent="Save PDF"; }
    const sh=btn("share"); if(sh) sh.disabled=false;
  }).catch(()=>{ const sv=btn("save"); if(sv) sv.textContent="PDF not available"; });
  const close=()=>{ window.removeEventListener("resize",fit); ov.remove(); if(url) setTimeout(()=>URL.revokeObjectURL(url),60000); };
  ov.onclick=async e=>{ const v=e.target.closest("[data-v]")?.dataset.v; if(!v) return;
    if(v==="close") close();
    else if(v==="print"){ if(iab){ toast("Open in Safari first to print"); return; } printNow(d); }
    else if(v==="copy"){ try{ await navigator.clipboard.writeText(location.href.split("#")[0]); toast("Link copied. Paste it in Safari."); }catch(err){ prompt("Copy this link, then open it in Safari:", location.href.split("#")[0]); } }
    else if(v==="save" && blob){ const a=document.createElement("a"); a.href=url; a.download=fname; ov.appendChild(a); a.click(); a.remove(); toast("PDF saved"); }
    else if(v==="share" && blob){
      const file=new File([blob], fname, {type:"application/pdf"});
      try{ if(navigator.canShare && !navigator.canShare({files:[file]})) throw new Error("no"); await navigator.share({files:[file], title:"Footwork PH contract"}); }
      catch(err){ if(err && err.name==="AbortError") return; window.open(url,"_blank"); }
    }
  };
}
async function downloadContract(d, btn){
  const old=btn?btn.textContent:""; if(btn){ btn.disabled=true; btn.textContent="Making PDF…"; }
  try{ const b=await makeContractPdf(d); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=docFileName(d);
    ((dlg&&dlg.open)?dlg:document.body).appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
    toast(inAppBrowser()?"Messenger may block downloads. Open in Safari.":"PDF downloaded"); }
  catch(e){ toast("Could not make the PDF. Try Print contract."); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=old; } }
}

const CARDS_PER_SHEET = 5;
function cardSheets(list){
  const out=[]; for(let i=0;i<list.length;i+=CARDS_PER_SHEET) out.push(list.slice(i,i+CARDS_PER_SHEET));
  return out.map(g=>`<section class="fwk-sheet">${g.map(cardPair).join("")}<div class="fwk-note">Print at 100% (actual size) · Cut on the grey lines · Put front and back together in an ID jacket</div></section>`).join("");
}
const cardFileName = list => (list.length===1
  ? `Footwork-PH-Card-${list[0].memberNo||"member"}-${(list[0].name||"").trim()}`
  : `Footwork-PH-Cards-${list.length}-members-${todayISO()}`).replace(/[^\w.-]+/g,"-").replace(/-+/g,"-").replace(/-$/,"") + ".pdf";
async function makeCardPdf(list){
  const box=document.createElement("div"); box.className="fwc-off"; box.innerHTML=cardSheets(list); document.body.appendChild(box);
  try{
    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
                       loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
    await contractReady(box);
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const pages=[...box.querySelectorAll(".fwk-sheet")];
    for(let i=0;i<pages.length;i++){
      const c=await window.html2canvas(pages[i],{scale:3.2,backgroundColor:"#ffffff",useCORS:true,logging:false});
      if(i) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297);
    }
    pdf.setProperties({title:"Footwork PH Membership Cards",author:"Footwork PH"});
    return pdf.output("blob");
  } finally { box.remove(); }
}
function printCardsNow(list){
  let box=document.getElementById("fwPrint");
  if(!box){ box=document.createElement("div"); box.id="fwPrint"; document.body.appendChild(box); }
  box.innerHTML = cardSheets(list);
  const prev=document.title; document.title=cardFileName(list).replace(/\.pdf$/,"");
  document.body.classList.add("fw-printing");
  const done=()=>{ document.body.classList.remove("fw-printing"); document.title=prev; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  try{ window.print(); }catch(e){}
  setTimeout(()=>{ if(!matchMedia("print").matches) done(); },2000);
}
function printCards(list){
  list = (list||[]).filter(Boolean);
  if(!list.length){ toast("No members to print"); return; }
  const host = (dlg && dlg.open) ? dlg : document.body;
  const old=document.getElementById("fwcOv"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="fwc-ov"; ov.id="fwcOv";
  const iab=inAppBrowser(), fname=cardFileName(list);
  const title = list.length===1 ? `Card · ${esc(list[0].name||"Member")}` : `${list.length} membership cards`;
  ov.innerHTML=`<div class="fwc-tb">
      <div class="row"><h3>${title}</h3><button type="button" class="btn sm ghost" data-v="close">✕ Close</button></div>
      ${iab?`<div class="fwc-warn"><b>You're in the Messenger (in-app) browser.</b> It blocks printing and downloads. Tap <b>•••</b> at the top right, then <b>Open in Safari</b> (or your browser). Then print from there.<div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-v="copy">Copy app link</button></div></div>`:""}
      <div class="row">
        <button type="button" class="btn sm ghost" data-v="save" disabled>Preparing PDF…</button>
        <button type="button" class="btn sm ghost" data-v="print">🖨 Print</button>
        ${navigator.share?`<button type="button" class="btn sm ghost" data-v="share" disabled>Share / Print PDF</button>`:""}
      </div>
      <div class="small muted">A4 sheet, ${CARDS_PER_SHEET} cards per page, real ID size. Print at 100% (actual size), not "Fit to page".</div>
    </div>
    <div class="fwc-sc"><div class="fwc-zoom">${cardSheets(list)}</div></div>`;
  host.appendChild(ov);
  ov.querySelectorAll(".fwk-sheet").forEach(p=>{ p.style.margin="0 auto 12px"; p.style.boxShadow="0 2px 10px rgba(0,0,0,.35)"; });
  const zoom=ov.querySelector(".fwc-zoom"), sc=ov.querySelector(".fwc-sc");
  const fit=()=>{ const w=sc.clientWidth-24, z=Math.min(1, w/794); zoom.style.zoom=z; };
  fit(); window.addEventListener("resize",fit);
  let blob=null, url=null;
  const btn=v=>ov.querySelector(`[data-v="${v}"]`);
  makeCardPdf(list).then(b=>{ blob=b; url=URL.createObjectURL(b);
    const sv=btn("save"); if(sv){ sv.disabled=false; sv.textContent="⬇ Download PDF"; sv.classList.remove("ghost"); }
    const sh=btn("share"); if(sh) sh.disabled=false;
  }).catch(()=>{ const sv=btn("save"); if(sv) sv.textContent="PDF not available"; });
  const close=()=>{ window.removeEventListener("resize",fit); ov.remove(); if(url) setTimeout(()=>URL.revokeObjectURL(url),60000); };
  ov.onclick=async e=>{ const v=e.target.closest("[data-v]")?.dataset.v; if(!v) return;
    if(v==="close") close();
    else if(v==="print"){ if(iab){ toast("Open in Safari first to print"); return; } printCardsNow(list); }
    else if(v==="copy"){ try{ await navigator.clipboard.writeText(location.href.split("#")[0]); toast("Link copied. Paste it in Safari."); }catch(err){ prompt("Copy this link, then open it in Safari:", location.href.split("#")[0]); } }
    else if(v==="save" && blob){ const a=document.createElement("a"); a.href=url; a.download=fname; ov.appendChild(a); a.click(); a.remove(); toast(iab?"Messenger may block downloads. Open in Safari.":"Card PDF saved"); }
    else if(v==="share" && blob){
      const file=new File([blob], fname, {type:"application/pdf"});
      try{ if(navigator.canShare && !navigator.canShare({files:[file]})) throw new Error("no"); await navigator.share({files:[file], title:"Footwork PH membership cards"}); }
      catch(err){ if(err && err.name==="AbortError") return; window.open(url,"_blank"); }
    }
  };
}
function pickCards(){
  const mems = S.members.filter(m=>m.type==="member").sort((a,b)=>(a.memberNo||"").localeCompare(b.memberNo||"",undefined,{numeric:true}));
  if(!mems.length){ toast("No members yet"); return; }
  const old=document.getElementById("fwcOv"); if(old) old.remove();
  const ov=document.createElement("div"); ov.className="fwc-ov"; ov.id="fwcOv";
  ov.innerHTML=`<div class="fwc-tb"><div class="row"><h3>Print membership cards</h3><button type="button" class="btn sm ghost" data-v="close">✕ Close</button></div>
      <div class="row"><button type="button" class="btn sm" data-v="go">Make cards</button><button type="button" class="btn sm ghost" data-v="all">Tick all</button><button type="button" class="btn sm ghost" data-v="none">Clear</button></div>
      <div class="small muted">Tick the members whose cards you will print. ${CARDS_PER_SHEET} cards fit on one A4 sheet.</div></div>
    <div class="fwc-sc"><div class="fwk-pick">${mems.map(m=>`<label><input type="checkbox" value="${m.id}" ${cardExpired(m)?"":"checked"}><span style="flex:1;min-width:0"><b>${esc(m.memberNo||"—")}</b> · ${esc(m.name||"")}</span><span class="small muted">${m.validUntil?(cardExpired(m)?"Expired":"Until "+fmtDate(m.validUntil)):""}</span></label>`).join("")}</div></div>`;
  document.body.appendChild(ov);
  const boxes=()=>[...ov.querySelectorAll(".fwk-pick input")];
  ov.onclick=e=>{ const v=e.target.closest("[data-v]")?.dataset.v; if(!v) return;
    if(v==="close") ov.remove();
    else if(v==="all") boxes().forEach(b=>b.checked=true);
    else if(v==="none") boxes().forEach(b=>b.checked=false);
    else if(v==="go"){ const ids=boxes().filter(b=>b.checked).map(b=>b.value); if(!ids.length){ toast("Tick at least one member"); return; } ov.remove(); printCards(ids.map(member)); }
  };
}
/* ---------- contract files (kept on this device) ---------- */
const FILE_DB="footworkph-files", FILE_STORE="contracts";
function fileDb(){ return new Promise((res,rej)=>{ let rq; try{ rq=indexedDB.open(FILE_DB,1); }catch(e){ rej(e); return; }
  rq.onupgradeneeded=()=>rq.result.createObjectStore(FILE_STORE); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function fileOp(mode, fn){ const db=await fileDb(); return new Promise((res,rej)=>{ const tx=db.transaction(FILE_STORE,mode); const rq=fn(tx.objectStore(FILE_STORE));
  tx.oncomplete=()=>{ db.close(); res(rq.result); }; tx.onerror=tx.onabort=()=>{ db.close(); rej(tx.error); }; }); }
const fileSave = (id,f) => fileOp("readwrite", s=>s.put(f,id));
const fileGet = id => fileOp("readonly", s=>s.get(id)).catch(()=>null);
const fileDel = id => fileOp("readwrite", s=>s.delete(id)).catch(()=>{});

/* rate per class type: free classes = 0, promo covers all classes, else the class type's own regular rate, else the default */
const rate = (key, typeId) => {
  const r=S.settings.rates[key]||{}, t=typeId?ctype(typeId):null;
  if(t && t.free && key!=="membershipFee") return 0;
  if(promoOn() && isSet(r.promo)) return +r.promo;
  const tk = key==="member"?"memRate":key==="nonMember"?"nonRate":"";
  if(t && tk && isSet(t[tk])) return +t[tk];
  return +r.reg||0;
};
/* packages: for members or non-members, one class type, counted only when used */
const pkgUsed = m => S.sessions.reduce((a,s)=>a+(s.attendees||[]).filter(x=>x.memberId===m.id && x.pkg && (!m.startDate || s.date>=m.startDate)).length,0);
const pkgExp = (m,p) => p && m.startDate && +p.days ? addDays(m.startDate, +p.days) : null;
function pkgFor(m, s){
  const p = plan(m.planId); if(!p || !s) return null;
  const kind = m.type==="member" && !cardExpired(m) ? "member" : "nonmember";
  if(p.for && p.for!==kind) return null;
  const types = m.planType ? [m.planType] : (p.typeIds||[]);
  if(types.length && !types.includes(s.typeId)) return null;
  if(m.startDate && s.date < m.startDate) return null;
  const exp = pkgExp(m,p); if(exp && s.date > exp) return null;
  if(+p.sessions && pkgUsed(m) >= +p.sessions) return null;
  const paid = +m.paid>0 ? +m.paid : planPrice(p);
  return { amount: +p.sessions ? paid/(+p.sessions) : 0 };
}
function priceFor(m, s, kind){
  const pk = pkgFor(m, s);
  if(pk) return { amount: Math.round(pk.amount*100)/100, pkg:true };
  return { amount: rate(kind==="member"?"member":"nonMember", s && s.typeId), pkg:false };
}
const planPrice = p => promoOn() && isSet(p.promoPrice) ? +p.promoPrice : (+p.price||0);
const inR = (d,r) => d && d>=r.from && d<=r.to;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }

/* ---------- period filter (shared) ---------- */
const P = { mode:"month", day:todayISO(), month:todayISO().slice(0,7), year:todayISO().slice(0,4), from:addDays(todayISO(),-6), to:todayISO() };
const mondayOf = iso => { const d=new Date(iso+"T00:00"); return addDays(iso,-((d.getDay()+6)%7)); };
const lastDayOf = ym => { const [y,m]=ym.split("-").map(Number); return ym+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0"); };
const shortD = iso => new Date(iso+"T00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"});
const monthName = ym => new Date(ym+"-01T00:00").toLocaleDateString("en-PH",{month:"long",year:"numeric"});
const daysBetween = (f,t) => Math.round((new Date(t+"T00:00")-new Date(f+"T00:00"))/864e5)+1;
function periodRange(){
  if(P.mode==="day") return {from:P.day, to:P.day, label:new Date(P.day+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"})};
  if(P.mode==="week"){ const f=mondayOf(P.day), t=addDays(f,6); return {from:f, to:t, label:`${shortD(f)} – ${shortD(t)}, ${t.slice(0,4)}`}; }
  if(P.mode==="year") return {from:P.year+"-01-01", to:P.year+"-12-31", label:"Year "+P.year};
  if(P.mode==="range"){ let f=P.from||todayISO(), t=P.to||f; if(t<f){ const x=f; f=t; t=x; } return {from:f, to:t, label:`${shortD(f)} – ${shortD(t)}, ${t.slice(0,4)}`}; }
  return {from:P.month+"-01", to:lastDayOf(P.month), label:monthName(P.month)};
}
function periodNav(dir){
  if(P.mode==="day") P.day=addDays(P.day,dir);
  else if(P.mode==="week") P.day=addDays(P.day,7*dir);
  else if(P.mode==="year") P.year=String(+P.year+dir);
  else if(P.mode==="month"){ const [y,m]=P.month.split("-").map(Number); const d=new Date(y,m-1+dir,1); P.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  else { const r=periodRange(), n=daysBetween(r.from,r.to); P.from=addDays(r.from,n*dir); P.to=addDays(r.to,n*dir); }
}
function periodBar(){
  const r=periodRange(), m=P.mode;
  const inp = (m==="day"||m==="week") ? `<input type="date" data-pin="day" value="${P.day}" aria-label="${m==="week"?"Any day in the week":"Day"}">`
    : m==="month" ? `<input type="month" data-pin="month" value="${P.month}" aria-label="Month">`
    : m==="year" ? `<input type="number" min="2020" max="2100" data-pin="year" value="${P.year}" aria-label="Year" style="width:110px">`
    : `<input type="date" data-pin="from" value="${P.from}" aria-label="From"><span class="muted small">to</span><input type="date" data-pin="to" value="${P.to}" aria-label="To">`;
  return `<div class="card" style="padding:12px">
    <div class="seg" role="group" aria-label="Filter by" style="margin-bottom:10px">${[["day","Day"],["week","Week"],["month","Month"],["year","Year"],["range","Dates"]].map(([k,l])=>`<button type="button" data-pmode="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>
    <div class="row between">
      <button type="button" class="btn sm ghost" data-pnav="-1" aria-label="Previous">‹</button>
      <b style="text-align:center;flex:1">${r.label}</b>
      <button type="button" class="btn sm ghost" data-pnav="1" aria-label="Next">›</button>
    </div>
    <div class="row pinputs" style="margin-top:10px;justify-content:center">${inp}</div>
  </div>`;
}
function periodEvent(el, type){
  if(type==="click"){
    if(el.dataset.pmode){ const nm=el.dataset.pmode;
      if(nm==="month") P.month=P.day.slice(0,7);
      if(nm==="year") P.year=P.day.slice(0,4);
      P.mode=nm; return true; }
    if(el.dataset.pnav){ periodNav(+el.dataset.pnav); return true; }
  } else if(type==="change" && el.dataset.pin){
    const k=el.dataset.pin; if(!el.value) return false;
    P[k]=el.value; if(k==="month") P.day=el.value+"-01"; if(k==="year") P.day=el.value+"-01-01"; return true;
  }
  return false;
}

/* ---------- calculations ---------- */
const payMode = i => (i && (i.payType==="class"||i.payType==="day") && +i.rate>0) ? i.payType : "pct";
function payLabel(i){
  const m = payMode(i);
  if(m==="class") return `Fixed ${peso(i.rate)} per class`;
  if(m==="day") return `Fixed ${peso(i.rate)} per day`;
  const pct = isSet(i&&i.pct)?+i.pct:+S.settings.instructorPct, min = isSet(i&&i.min)?+i.min:+S.settings.minPerClass;
  return `${pct}% / ${100-pct}% split${min?` · min ${peso(min)} per class`:""}`;
}
function instRate(s){
  const ins = instr(s.instructorId);
  const mode = payMode(ins);
  const pct = isSet(s.pctOverride) ? +s.pctOverride : (ins && isSet(ins.pct) ? +ins.pct : +S.settings.instructorPct);
  const min = ins && isSet(ins.min) ? +ins.min : (+S.settings.minPerClass||0);
  return {pct, min, mode, rate: mode==="pct" ? 0 : +ins.rate};
}
const paysFor = s => s.instStatus!=="absent" && (s.attendees||[]).length>0;
function sessionCalc(s){
  const gross = (s.attendees||[]).reduce((a,x)=>a+(+x.amount||0),0);
  const {pct,min,mode,rate} = instRate(s);
  const absent = s.instStatus==="absent";
  const pays = paysFor(s);
  let inst, usedMin=false, dayShare=0;
  if(mode==="class"){ inst = pays ? rate : 0; }
  else if(mode==="day"){
    // one daily rate, split evenly across this instructor's classes that day
    const n = pays ? 1 + S.sessions.filter(x=>x.id!==s.id && x.instructorId===s.instructorId && x.date===s.date && paysFor(x)).length : 0;
    dayShare = n; inst = pays ? rate/n : 0;
  } else {
    const byPct = gross*pct/100;
    inst = pays ? Math.max(byPct, min) : 0;
    usedMin = pays && inst>byPct && inst>0;
  }
  const effPct = mode==="pct" ? pct : (gross>0 ? Math.round(inst/gross*100) : 0);
  const note = mode==="class" ? `fixed ${peso(rate)}/class` : mode==="day" ? `fixed ${peso(rate)}/day${dayShare>1?` ÷ ${dayShare} classes`:""}` : "";
  return { gross, pct:effPct, inst, biz: gross-inst, usedMin, absent, mode, note };
}
function expectedCalc(s){
  const done = new Set((s.attendees||[]).map(a=>a.memberId));
  const extra = bkFor(s.id).filter(b=>b.status==="confirmed" && (!b.member_id || !done.has(b.member_id))).map(b=>{
    const m = b.member_id && member(b.member_id);
    const kind = m ? (m.type==="member"?"member":"nonmember") : (b.is_member?"member":"nonmember");
    const amt = isSet(b.amount) && +b.amount===0 ? 0 : (m ? priceFor(m, s, kind).amount : rate(kind==="member"?"member":"nonMember", s.typeId));
    return {memberId:b.member_id||("bk_"+b.id), kind, amount:Math.round((+amt||0)*100)/100};
  });
  const c = sessionCalc(Object.assign({}, s, {attendees:(s.attendees||[]).concat(extra)}));
  c.pending = extra.length; return c;
}
const rentalAuto = r => (+r.hours||0)*(+S.settings.rental.hour||0) + (+r.extHours||0)*(+S.settings.rental.extHour||0);
const rentalAmt = r => isSet(r.amount) ? +r.amount : rentalAuto(r);
const itemStock = id => S.expenses.filter(e=>e.itemId===id).reduce((a,e)=>a+(+e.qty||0),0) - S.sales.filter(x=>x.itemId===id).reduce((a,x)=>a+(+x.qty||0),0);
function memberStats(m){
  const visits = S.sessions.filter(s=>(s.attendees||[]).some(x=>x.memberId===m.id)).sort((a,b)=>b.date.localeCompare(a.date));
  const spent = S.sessions.reduce((a,s)=>a+(s.attendees||[]).filter(x=>x.memberId===m.id).reduce((b,x)=>b+(+x.amount||0),0),0);
  const last = visits[0]?.date || "";
  const p = plan(m.planId);
  const used = pkgUsed(m), total = p ? +p.sessions||0 : 0;
  const left = total ? total-used : null;
  const exp = pkgExp(m,p);
  const today = todayISO();
  if(m.type==="nonmember"){
    const pk = p ? { p, used, left, exp } : {};
    if(p && ((exp && exp < today) || (left!==null && left<=0))) return { ...pk, visits:visits.length, spent, last, status:"Package used up", cls:"bad", perSession: rate("nonMember") };
    if(p) return { ...pk, visits:visits.length, spent, last, status:"Package", cls:"ok", perSession: rate("nonMember") };
    if(m.lapsedOn) return { visits:visits.length, spent, last, status:"Membership expired", cls:"bad", perSession: rate("nonMember") };
    return { visits:visits.length, spent, last, status: visits.length>=4?"Offer membership":"Walk-in", cls: visits.length>=4?"warn":"", perSession: rate("nonMember") };
  }
  let status="Active", cls="ok";
  if(exp && exp < today){ status="Expired"; cls="bad"; }
  else if(left!==null && left<=0){ status="Used up"; cls="bad"; }
  else if((exp && addDays(today,5) >= exp) || (left!==null && left<=2)){ status="Renew soon"; cls="warn"; }
  if(m.validUntil){ if(m.validUntil < today){ status="Membership expired"; cls="bad"; } else if(cls==="ok" && addDays(today,14) >= m.validUntil){ status="Renew soon"; cls="warn"; } }
  return { p, used, left, exp, status, cls, perSession: rate("member"), visits:visits.length, spent, last };
}
function totals(r){
  const ses = S.sessions.filter(s=>inR(s.date,r));
  let gross=0, inst=0, biz=0, heads=0, memHeads=0, nonHeads=0, nonSales=0, memSales=0, unpaid=0; const byType={};
  ses.forEach(s=>{ const c=sessionCalc(s); gross+=c.gross; inst+=c.inst; biz+=c.biz; if(!s.paidOut) unpaid+=c.inst;
    const k=typeName(s); const o=byType[k]||(byType[k]={n:0,heads:0,gross:0,biz:0}); o.n++; o.heads+=(s.attendees||[]).length; o.gross+=c.gross; o.biz+=c.biz;
    (s.attendees||[]).forEach(a=>{ heads++; if(a.kind==="nonmember"){nonHeads++; nonSales+=+a.amount||0;} else {memHeads++; memSales+=+a.amount||0;} }); });
  const exps = S.expenses.filter(e=>inR(e.date,r));
  const exp = exps.reduce((a,e)=>a+(+e.amount||0),0);
  const expMerch = exps.filter(e=>e.itemId).reduce((a,e)=>a+(+e.amount||0),0);
  const fees = S.members.reduce((a,m)=>a+(feeCounts(m)&&inR(m.feeDate,r)?(+m.feePaid||0):0)+(m.feeHistory||[]).reduce((b,f)=>b+(inR(f.date,r)?(+f.amount||0):0),0),0);
  const packs = S.members.filter(m=>(feeCounts(m) || m.planId) && inR(m.paidDate,r)).reduce((a,m)=>a+(+m.paid||0),0);
  const rents = S.rentals.filter(x=>inR(x.date,r));
  const rental = rents.filter(x=>x.status==="paid").reduce((a,x)=>a+rentalAmt(x),0);
  const rentalPending = rents.filter(x=>x.status==="pending").reduce((a,x)=>a+rentalAmt(x),0);
  const sls = S.sales.filter(x=>inR(x.date,r));
  const merch = sls.reduce((a,x)=>a+saleTotal(x),0);
  const income = biz+fees+rental+merch;
  return { ses, gross, inst, biz, exp, expMerch, fees, packs, rental, rentalPending, merch, income, net: income-exp, heads, memHeads, nonHeads, memSales, nonSales, unpaid, byType, rentCount:rents.filter(x=>x.status!=="cancelled").length, itemsSold:sls.reduce((a,x)=>a+(+x.qty||0),0) };
}
function buckets(r){
  const span = daysBetween(r.from,r.to), out=[];
  if(span<=1) return {title:"", list:[]};
  if(span<=14){ for(let d=r.from; d<=r.to; d=addDays(d,1)) out.push({from:d,to:d,label:new Date(d+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"})}); return {title:"Daily breakdown",list:out}; }
  if(span<=62){ for(let w=mondayOf(r.from); w<=r.to; w=addDays(w,7)){ const f=w<r.from?r.from:w, t=addDays(w,6)>r.to?r.to:addDays(w,6); out.push({from:f,to:t,label:`${shortD(f)} – ${shortD(t)}`}); } return {title:"Weekly breakdown",list:out}; }
  let ym=r.from.slice(0,7);
  while(ym<=r.to.slice(0,7)){ const f=ym+"-01"<r.from?r.from:ym+"-01", t=lastDayOf(ym)>r.to?r.to:lastDayOf(ym); out.push({from:f,to:t,label:new Date(ym+"-01T00:00").toLocaleDateString("en-PH",{month:"short",year:"numeric"})});
    const [y,m]=ym.split("-").map(Number); const d=new Date(y,m,1); ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  return {title:"Monthly breakdown",list:out};
}
function splitBar(inst, biz, pct, c){
  const gross = inst+biz, fixed = c && c.mode && c.mode!=="pct";
  if(c && gross<=0 && inst<=0) return `<div class="split"><div class="bar" role="img" aria-label="No sales yet"><div class="biz" style="opacity:.35">No sales yet</div></div>
    <div class="legend"><span>Instructor ₱0${fixed?` (${esc(c.note)})`:""}</span><span>Studio ₱0</span></div></div>`;
  const w = gross>0 ? Math.max(0,Math.min(100, inst/gross*100)) : (fixed?100:+pct);
  const iL = fixed ? (w>=22?"Fixed "+peso(inst):"") : (w>=18?Math.round(w)+"%":"");
  const bL = fixed ? (100-w>=22?peso(biz):"") : (100-w>=18?Math.round(100-w)+"%":"");
  return `<div class="split"><div class="bar" role="img" aria-label="Instructor ${peso(inst)}, studio ${peso(biz)}">

    <div class="legend"><span>Instructor ${peso(inst)}${fixed?` (${esc(c.note)})`:""}</span><span${biz<0?' style="color:var(--bad)"':""}>Studio ${peso(biz)}</span></div>
    ${c?`<p class="small muted" style="margin:4px 0 0">Sales ${peso(gross)} − Instructor ${peso(inst)}${fixed?" fixed":` (${Math.round(+pct)}%)`} = <b${biz<0?' style="color:var(--bad)"':""}>Studio ${peso(biz)}</b>${biz<0?" · loss: sales are below the instructor's fixed rate":""}</p>`:""}</div>`;
}

const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

const weekSessions = ws => { const we=addDays(ws,6); return S.sessions.filter(s=>s.date>=ws && s.date<=we).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))); };
const weekLabel = ws => { const we=addDays(ws,6); return `${shortD(ws)} – ${shortD(we)}, ${we.slice(0,4)}`; };
const fmtStamp = iso => { const d=new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-PH",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); };
function vWeek(){
  const ws=curWeek(), list=weekSessions(ws), today=todayISO(), cap=+S.settings.capacity||10;
  const sent = S.settings.mail.sent[ws];

    const d=addDays(ws,i), items=list.filter(s=>s.date===d);

      ${items.map(s=>{ const ins=instr(s.instructorId), n=slotsTaken(s);

      ${items.length?"":`<p class="small muted" style="margin:0">No class</p>`}

      <button type="button" class="btn sm ghost" data-act="calNav" data-v="-1" aria-label="Previous week">‹</button>

  const ws=curWeek(), prev=weekSessions(addDays(ws,-7)), cur=weekSessions(ws);

const EMAIL_RX = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const mailReady = () => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(S.settings.mail.url||"");
async function mailPost(payload){
  const r = await fetch(S.settings.mail.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({key:S.settings.mail.key}, payload))});
  return r.json();
}
function sendSchedDlg(){
  const ws=curWeek();
  if(!weekSessions(ws).length){ toast("No classes this week yet. Plot the schedule first."); return; }
  if(!mailReady()){
    openDlg("Set up email first", `<p>Email sending is not set up yet. It takes about 5 minutes, one time only.</p>
      <p class="small muted">While waiting, tap <b>Copy for Viber</b> to post the schedule in your members' community.</p>`,
      {saveLabel:"Go to setup", onSave:()=>{ tab="settings"; setTimeout(()=>{ render(); const el=document.getElementById("mailSetup"); if(el) el.scrollIntoView(); },0); }});
    return;
  }
  const byName=(a,b)=>a.name.localeCompare(b.name);
  const act = S.members.filter(m=>m.type==="member" && !cardExpired(m)).sort(byName);
  const withMail = act.filter(m=>EMAIL_RX.test((m.email||"").trim()));
  const noMail = act.filter(m=>!EMAIL_RX.test((m.email||"").trim()));
  const nons = S.members.filter(m=>m.type!=="member" && EMAIL_RX.test((m.email||"").trim())).sort(byName);
  const rcp = (m,on) => `<label class="rcp"><input type="checkbox" data-rcp="${m.id}" ${on?"checked":""}><span class="nm"><b>${esc(m.name)}</b><br><span class="small muted">${esc(m.email.trim())}</span></span></label>`;
  openDlg("Email schedule to members", `

    <label class="f">Subject<input id="ms_subj" value="${esc("Footwork PH Class Schedule · "+weekLabel(ws))}"></label>

    <h3 style="margin:6px 0 2px">Members (${withMail.length})</h3>
    ${withMail.length?`<div class="row" style="margin:4px 0"><button type="button" class="btn sm ghost" id="ms_all">Tick all</button><button type="button" class="btn sm ghost" id="ms_none">Untick all</button></div>${withMail.map(m=>rcp(m,true)).join("")}`:`<p class="small muted">No active member has an email saved yet.</p>`}
    ${noMail.length?`<p class="small muted" style="margin:8px 0 0">No email saved, so they won't get it: ${noMail.map(m=>esc(m.name)).join(", ")}. Add their email in Students.</p>`:""}
    ${nons.length?`<details style="margin-top:10px"><summary class="small"><b>Also send to non-members (${nons.length})</b></summary>${nons.map(m=>rcp(m,false)).join("")}</details>`:""}
    <details style="margin-top:12px"><summary class="small"><b>Preview email</b></summary><iframe class="mailprev" id="ms_prev" sandbox="" title="Email preview"></iframe></details>
    <p class="small muted" style="margin:10px 0 0">Each person gets their own email from your studio Gmail, so no one sees the others' addresses.</p>`,
  { saveLabel:"Send", onSave:()=>{
      const ids=[...document.querySelectorAll("#dlgBody [data-rcp]:checked")].map(x=>x.dataset.rcp);
      const to=[...new Set(ids.map(id=>(member(id)?.email||"").trim().toLowerCase()).filter(e=>EMAIL_RX.test(e)))];
      if(!to.length){ toast("Tick at least one person"); return false; }
      if(!navigator.onLine){ toast("You're offline. Connect to the internet first."); return false; }
      const btn=document.getElementById("dlgSave"); btn.disabled=true; btn.textContent="Sending…";
      const note=document.getElementById("ms_note").value.trim();

        .then(r=>{

          toast(`Sent to ${r.sent} ${r.sent===1?"person":"people"}`+(r.failed&&r.failed.length?` · ${r.failed.length} failed`:""));

        .catch(err=>{ btn.disabled=false; btn.textContent="Send"; toast("Not sent: "+(err&&err.message||"check your connection")); });
      return false;
    } });
  const body=document.getElementById("dlgBody");
  const setAll = on => withMail.forEach(m=>{ const c=body.querySelector(`[data-rcp="${m.id}"]`); if(c) c.checked=on; });

  body.onchange=upd; upd();

const emailOf = m => { const e=(m.email||"").trim(); if(EMAIL_RX.test(e)) return e; const f=String((m.notes||"")+" "+(m.contact||"")).match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/); return f?f[0]:""; };
function sendNonDlg(){
  if(!mailReady()){
    openDlg("Set up email first", `<p>Email sending is not set up yet. Paste your Web app URL in Settings › Email setup first.</p>`,

  const byName=(a,b)=>a.name.localeCompare(b.name);
  const all = S.members.filter(m=>m.type!=="member").sort(byName);
  const withMail = all.filter(m=>emailOf(m)), noMail = all.filter(m=>!emailOf(m));
  const rcp = m => `<label class="rcp"><input type="checkbox" data-rcp="${m.id}" checked><span class="nm"><b>${esc(m.name)}</b><br><span class="small muted">${esc(emailOf(m))}${(m.email||"").trim()?"":" · from notes"}</span></span></label>`;
  const subj0 = "Book your slot at Footwork PH 💃";
  openDlg("Email non-members", `
    <p class="small muted" style="margin:0 0 10px">Sends the guest booking link, how to book, rates, non-member packages, and an invite to become a member.</p>
    <label class="f">Subject<input id="mn_subj" value="${esc(subj0)}"></label>
    <label class="f">Short message (optional)<textarea id="mn_note" rows="3" placeholder="e.g. Hi! Our grand opening is on Nov 7. See you there!"></textarea></label>
    <h3 style="margin:6px 0 2px">Non-members (${withMail.length})</h3>
    ${withMail.length?`<div class="row" style="margin:4px 0"><button type="button" class="btn sm ghost" id="mn_all">Tick all</button><button type="button" class="btn sm ghost" id="mn_none">Untick all</button></div>${withMail.map(rcp).join("")}`:`<p class="small muted">No non-member has an email saved yet.</p>`}
    ${noMail.length?`<p class="small muted" style="margin:8px 0 0">No email saved, so they won't get it: ${noMail.map(m=>esc(m.name)).join(", ")}.</p>`:""}
    <details style="margin-top:12px"><summary class="small"><b>Preview email</b></summary><iframe class="mailprev" id="mn_prev" sandbox="" title="Email preview"></iframe></details>
    <p class="small muted" style="margin:10px 0 0">Each person gets their own email from your studio Gmail.</p>`,
  { saveLabel:"Send", onSave:()=>{
      const ids=[...document.querySelectorAll("#dlgBody [data-rcp]:checked")].map(x=>x.dataset.rcp);
      const to=[...new Set(ids.map(id=>emailOf(member(id)||{}).toLowerCase()).filter(e=>EMAIL_RX.test(e)))];
      if(!to.length){ toast("Tick at least one person"); return false; }
      if(!navigator.onLine){ toast("You're offline. Connect to the internet first."); return false; }
      const btn=document.getElementById("dlgSave"); btn.disabled=true; btn.textContent="Sending…";
      const note=document.getElementById("mn_note").value.trim();
      mailPost({to, subject:val("mn_subj")||subj0, html:nonInviteHtml(note), text:nonInviteText(note)})
        .then(r=>{
          if(!r || !r.ok) throw new Error((r&&r.error)||"Not sent");
          dlg.close(); toast(`Sent to ${r.sent} ${r.sent===1?"person":"people"}`+(r.failed&&r.failed.length?` · ${r.failed.length} failed`:""));
        })
        .catch(err=>{ btn.disabled=false; btn.textContent="Send"; toast("Not sent: "+(err&&err.message||"check your connection")); });
      return false;
    } });
  const body=document.getElementById("dlgBody");
  const setAll = on => withMail.forEach(m=>{ const c=body.querySelector(`[data-rcp="${m.id}"]`); if(c) c.checked=on; });
  const a=document.getElementById("mn_all"), n=document.getElementById("mn_none");
  if(a) a.onclick=()=>setAll(true); if(n) n.onclick=()=>setAll(false);
  const drawPrev=()=>{ const f=document.getElementById("mn_prev"); if(f) f.srcdoc=nonInviteHtml(document.getElementById("mn_note").value.trim()); };
  drawPrev(); document.getElementById("mn_note").oninput=drawPrev;

  body.onchange=upd; upd();

function mailScript(){
  if(!S.settings.mail.key){ S.settings.mail.key = uid()+uid()+uid(); save(); }
  return `// Footwork PH - schedule email sender
// Runs on your studio Gmail. Free, up to 100 emails a day.
const SECRET = "${S.settings.mail.key}";

function doPost(e){
  try{
    const d = JSON.parse(e.postData.contents);
    if(d.key !== SECRET) return out({ok:false, error:"Wrong key. Copy the setup script again."});
    const to = (d.to || []).filter(function(x){ return /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(x); }).slice(0, 100);
    if(!to.length) return out({ok:false, error:"No valid emails"});
    const left = MailApp.getRemainingDailyQuota();
    if(to.length > left) return out({ok:false, error:"Daily limit reached. Only " + left + " emails left today."});
    let sent = 0; const failed = [];
    to.forEach(function(addr){
      try{ MailApp.sendEmail({to:addr, subject:String(d.subject||"Footwork PH Class Schedule").slice(0,200), htmlBody:String(d.html||""), body:String(d.text||""), name:"Footwork PH"}); sent++; }
      catch(err){ failed.push(addr); }
    });
    return out({ok:true, sent:sent, failed:failed, left:MailApp.getRemainingDailyQuota()});
  }catch(err){ return out({ok:false, error:String(err)}); }
}
function doGet(){ return out({ok:true, left:MailApp.getRemainingDailyQuota()}); }
function out(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;
}

function mailTest(){
  if(!mailReady()){ toast("Paste the Web app URL first. It ends in /exec"); return; }
  toast("Testing…");
  fetch(S.settings.mail.url).then(r=>r.json()).then(r=>{
    if(!r.ok) throw 0;
    return mailPost({to:[]}).then(x=>{ if(x && /Wrong key/.test(x.error||"")) toast("Connected, but the key doesn't match. Copy the script again and redeploy."); else toast(`Connected. ${r.left} emails left today.`); });
  }).catch(()=>toast("Can't reach it. Check the URL and that access is set to Anyone."));
}

const interestOpen = new Set();
const interestNames = m => (m.interests||[]).map(id=>ctype(id)?.name).filter(Boolean);
function interestGroups(){
  const non = S.members.filter(m=>m.type==="nonmember").sort((a,b)=>a.name.localeCompare(b.name));
  const groups = S.settings.classTypes.map(t=>({id:t.id, name:t.name, people:non.filter(m=>(m.interests||[]).includes(t.id))}));
  const none = non.filter(m=>!interestNames(m).length);
  if(none.length) groups.push({id:"_none", name:"No class picked yet", people:none});
  return {non, groups};
}
function contactHtml(c){
  c = String(c||"").trim();
  if(!c) return `<span class="small muted">No contact</span>`;
  return /^\+?[\d\s().-]{7,}$/.test(c) ? `<a href="tel:${esc(c.replace(/[^\d+]/g,""))}">${esc(c)}</a>` : `<span>${esc(c)}</span>`;
}
function interestSummary(){
  const {non, groups} = interestGroups();
  if(!non.length) return "";
  return `<div class="card"><h3>Class summary</h3>
    <p class="small muted" style="margin:2px 0 8px">Non-members by the class they are interested in. Tap a class to see names and numbers.</p>
    ${groups.map(g=>`<details class="isum" data-isum="${g.id}" ${interestOpen.has(g.id)?"open":""}>
      <summary><span class="nm">${esc(g.name)}</span><span class="pill ${g.people.length&&g.id!=="_none"?"pink":""}">${g.people.length}</span></summary>
      ${g.people.length?`<ul class="list">${g.people.map(m=>`<li><div class="row between"><b>${esc(m.name)}</b>${contactHtml(m.contact)}</div></li>`).join("")}</ul>

function copyInterest(id){
  const g = interestGroups().groups.find(x=>x.id===id); if(!g) return;

function instPeriod(i, r){
  const ses = S.sessions.filter(s=>s.instructorId===i.id && inR(s.date,r)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let earned=0, paid=0, pending=0, present=0, absent=0, sales=0;
  ses.forEach(s=>{ const c=sessionCalc(s); sales+=c.gross; if(c.absent) absent++; else present++; earned+=c.inst; if(s.paidOut) paid+=c.inst; else pending+=c.inst; });
  return {ses, earned, paid, pending, present, absent, sales};
}
function breakdownTable(ses, keyFn, labelFn, title){
  const g={}; ses.forEach(s=>{ const k=keyFn(s); const c=sessionCalc(s); const o=g[k]||(g[k]={n:0,sales:0,inst:0,pend:0}); o.n++; o.sales+=c.gross; o.inst+=c.inst; if(!s.paidOut) o.pend+=c.inst; });
  const keys=Object.keys(g).sort(); if(!keys.length) return "";
  const tot=keys.reduce((a,k)=>({n:a.n+g[k].n,sales:a.sales+g[k].sales,inst:a.inst+g[k].inst,pend:a.pend+g[k].pend}),{n:0,sales:0,inst:0,pend:0});
  return `<h3 style="margin:16px 0 6px">${title}</h3><div class="tablewrap"><table class="t"><thead><tr><th></th><th class="r">Classes</th><th class="r">Sales</th><th class="r">Commission</th><th class="r">Pending</th></tr></thead><tbody>

      if(mem){
        Object.assign(m,{memberNo:val("m_no"), email:val("m_email"), birthday:val("m_bday"), ecName:val("m_ecName"), ecNo:val("m_ecNo"), memType:val("m_mtype"), validFrom:val("m_vFrom"), validUntil:val("m_vUntil"), receivedBy:val("m_recBy"),
          feePaid:+val("m_fee")||0, feeDate:val("m_feeDate")});
        m.contract = cMeta || null;
        if(cFile){ const f=cFile; if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
          fileSave(m.id,f).catch(()=>{ m.contract=null; save(); render(); toast("Could not keep the file on this device"); }); }
        else if(cRemove) fileDel(m.id);
      }
      if(isNew) S.members.push(m); toast(joining?`Moved to Members as ${m.memberNo}`:isNew?(mem?"Added. Contract is ready to print.":"Added"):"Saved");
    },

  if(mem && !isNew){
    const qi = document.getElementById("m_qr"), drawQr = ()=>{ try{ qi.src = qrCanvas(cardText(m), 320).toDataURL("image/png"); }catch(e){} };
    drawQr();

      if(!confirm("Make a new QR code for "+m.name+"?\n\nThe QR on the old card will stop working. You will need to print a new card.")) return;
