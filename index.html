    };
    document.getElementById("m_card").onclick = ()=>printCards([Object.assign({}, m, {name:val("m_name"), memberNo:val("m_no"), validFrom:val("m_vFrom"), validUntil:val("m_vUntil")})]);
  }
  { const kData = ()=>consentDocData(Object.assign({}, m, {type: mem?"member":"nonmember", name:val("m_name"), contact:val("m_contact"), email:val("m_email"), birthday:val("m_bday"),
      ecName:val("m_ecName"), ecNo:val("m_ecNo"), memberNo: mem?val("m_no"):m.memberNo,
      interests: mem ? (m.interests||[]) : [...document.querySelectorAll('input[name="m_interest"]:checked')].map(x=>x.value)}));
    document.getElementById("m_kprint").onclick = ()=>printContract(kData());
    document.getElementById("m_kpdf").onclick = e=>downloadContract(kData(), e.currentTarget);
    if(!mem){ const wData = ()=>waiverDocData(Object.assign({}, kData(), {docKind:"waiver"}));
      document.getElementById("m_wprint").onclick = ()=>printContract(wData());
      document.getElementById("m_wpdf").onclick = e=>downloadContract(wData(), e.currentTarget); } }
  if(mem){
    const cData = ()=>Object.assign({}, m, {name:val("m_name"), memberNo:val("m_no"), contact:val("m_contact"), email:val("m_email"), birthday:val("m_bday"),
      ecName:val("m_ecName"), ecNo:val("m_ecNo"), memType:val("m_mtype"), validFrom:val("m_vFrom"), validUntil:val("m_vUntil"), feePaid:val("m_fee"), receivedBy:val("m_recBy")});
    document.getElementById("m_cprint").onclick = ()=>printContract(cData());
    document.getElementById("m_cpdf").onclick = e=>downloadContract(cData(), e.currentTarget);
    const sel=document.getElementById("m_plan"), paid=document.getElementById("m_paid");
    sel.onchange=()=>{ const p=plan(sel.value); if(p && !paid.value) paid.value=planPrice(p); };
    const vf=document.getElementById("m_vFrom"), vu=document.getElementById("m_vUntil");
    vf.onchange=()=>{ if(vf.value) vu.value=addMonths(vf.value, MEMBER_MONTHS); };
    const info=document.getElementById("m_cinfo"), btns=document.getElementById("m_cbtns"), fileEl=document.getElementById("m_cfile");
    const drawC=()=>{
      const missing = cMeta && !cFile && cBlob===false;
      info.textContent = cMeta ? `${cMeta.name} · ${fmtSize(cMeta.size)} · added ${fmtDate(cMeta.date)}${missing?" · file is not on this device":""}` : "No file yet. Upload the signed agreement (PDF or photo).";
      btns.innerHTML = cMeta ? `${missing?"":`<button type="button" class="btn sm" data-c="view">View</button>`}<button type="button" class="btn sm ghost" data-c="pick">Replace</button><button type="button" class="btn sm danger" data-c="rm">Remove</button>`
        : `<button type="button" class="btn sm" data-c="pick">Upload contract</button>`;
    };
    btns.onclick=e=>{ const a=e.target.dataset.c; if(!a) return;
      if(a==="pick") fileEl.click();
      else if(a==="rm"){ if(confirm("Remove this contract file?")){ cMeta=null; cFile=null; cRemove=true; drawC(); } }
      else if(a==="view"){ const f=cFile||cBlob; if(f) openFile(f); else toast("File is not on this device"); } };
    fileEl.onchange=()=>{ const f=fileEl.files[0]; fileEl.value=""; if(!f) return;
      if(!(f.type==="application/pdf" || f.type.startsWith("image/"))){ toast("Use a PDF or a photo"); return; }
      if(f.size > 15*1048576){ toast("File is too big. Max 15 MB."); return; }
      cFile=f; cRemove=false; cMeta={name:f.name, size:f.size, date:todayISO()}; drawC(); };
    drawC();
    if(m.contract) fileGet(m.id).then(b=>{ cBlob = b || false; if(document.getElementById("m_cinfo")===info) drawC(); });
  }
  const sw=document.getElementById("m_switch");
  if(sw) sw.onclick=()=>{ m.type = mem?"nonmember":"member";
    if(m.type==="member"){ m.feePaid=rate("membershipFee"); m.feeDate=todayISO(); m.startDate=todayISO(); if(!m.memberNo) m.memberNo=nextMemberNo(); m.memType="new"; m.validFrom=todayISO(); m.validUntil=addMonths(todayISO(), MEMBER_MONTHS); }
    save(); toast(m.type==="member"?"Now a member":"Moved to non-members"); peopleSeg=m.type; personDlg(m); };
}

function sessionDlg(s, preset){
  const isNew=!s;
  const pi = preset && preset.instructorId ? instr(preset.instructorId) : null;
  s = s ? structuredClone(s) : {id:uid(), date:(preset&&preset.date)||todayISO(), time:"18:00", typeId:(pi&&pi.types&&pi.types[0])||S.settings.classTypes[0]?.id||"", title:"", instructorId:(pi&&pi.id)||S.settings.instructors[0]?.id||"", attendees:[], paidOut:false, instStatus:"present", pctOverride:""};
  const newNon = [];
  const drawSum = ()=>{ const c=sessionCalc(s), e=expectedCalc(s); document.getElementById("s_sum").innerHTML = (e.pending?`<p class="small" style="margin:10px 0 0"><b>Expected with paid bookings</b> · ${slotsTaken(s)}/${S.settings.capacity} pax · Sales <b>${peso(e.gross)}</b></p>${splitBar(e.inst,e.biz,e.pct,e)}<p class="small muted" style="margin:10px 0 0">Actual (checked in only)</p>`:"") + `<p class="small" style="margin:10px 0 0">${slotsTaken(s)}/${S.settings.capacity} pax (${s.attendees.length} checked in) · Sales <b>${peso(c.gross)}</b></p>${splitBar(c.inst,c.biz,c.pct,c)}`; };
  const drawAtt = ()=>{
    const box=document.getElementById("s_att");
    box.innerHTML = s.attendees.length ? s.attendees.map((a,i)=>`<div class="att"><span class="nm">${esc(member(a.memberId)?.name||newNon.find(n=>n.id===a.memberId)?.name||a.name)} <span class="pill ${a.kind==="nonmember"?"":"pink"}">${a.kind==="nonmember"?"non-member":"member"}</span>${a.pkg?` <span class="pill ok">package</span>`:""}</span><input type="number" min="0" aria-label="Amount paid" data-i="${i}" value="${a.amount}"><button type="button" class="x" data-rm="${i}" aria-label="Remove">✕</button></div>`).join("") : `<p class="small muted">No one checked in yet.</p>`;
    box.querySelectorAll("input[data-i]").forEach(inp=>inp.oninput=()=>{ s.attendees[+inp.dataset.i].amount=+inp.value||0; drawSum(); });
    box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ s.attendees.splice(+b.dataset.rm,1); drawAtt(); });
    drawSum();
  };
  const sel = (id,label,items) => `<select id="${id}" style="flex:1;min-width:150px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"><option value="">${label}</option>${items}</select>`;
  const byName=(a,b)=>a.name.localeCompare(b.name);
  const {pct} = instRate(s);
  openDlg(isNew?"Add class":"Edit class", `
    <div class="grid2">
      <label class="f">Date<input type="date" id="s_date" value="${s.date}"></label>
      <label class="f">Time<input type="time" id="s_time" value="${s.time}"></label>
      <label class="f">Class type<select id="s_type">${typeOptions(s.typeId,"—")}</select></label>
      <label class="f">Instructor<select id="s_instr"><option value="">—</option>${S.settings.instructors.map(i=>`<option value="${i.id}" ${i.id===s.instructorId?"selected":""}>${esc(i.name)}</option>`).join("")}</select></label>
      <label class="f" id="s_pctwrap" ${instRate(s).mode!=="pct"?'style="display:none"':""}>Instructor % for this class<input type="number" min="0" max="100" id="s_pct" placeholder="Default ${pct}%" value="${s.pctOverride}"></label>
      <label class="f">Instructor attendance<select id="s_status"><option value="present" ${s.instStatus!=="absent"?"selected":""}>Present</option><option value="absent" ${s.instStatus==="absent"?"selected":""}>Absent</option></select></label>
    </div>
    ${bkFor(s.id).length?`<h3 style="margin:8px 0 6px">Booked online (${bkFor(s.id).length})</h3><div id="s_bk" style="margin-bottom:10px">${bkFor(s.id).map(b=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b>${esc(b.name)}</b> <span class="pill ${b.status==="confirmed"?"ok":"warn"}">${b.status==="confirmed"?"Paid":"Not paid yet"}</span></span><button type="button" class="btn sm ghost" data-bkadd="${esc(b.member_id||"")}">Check in</button></div>`).join("")}</div>`:""}
    <h3 style="margin:8px 0 6px">Attendance</h3>
    <div class="row" style="margin-bottom:8px">${sel("s_addm","Add a member…",S.members.filter(m=>m.type==="member").sort(byName).map(m=>`<option value="${m.id}">${esc(memLabel(m))}</option>`).join(""))}</div>
    <div class="row" style="margin-bottom:8px">${sel("s_addn","Add a non-member…",S.members.filter(m=>m.type==="nonmember").sort(byName).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join(""))}<button type="button" class="btn sm ghost" id="s_walk">New walk-in</button></div>
    <div id="s_att"></div><div id="s_sum"></div>`,
  { onSave:()=>{
      s.date=val("s_date"); s.time=val("s_time"); s.typeId=val("s_type"); s.instructorId=val("s_instr"); s.instStatus=val("s_status");
      const p=val("s_pct"); s.pctOverride = p===""?"":Math.max(0,Math.min(100,+p));
      if(!s.date){ toast("Pick a date"); return false; }
      newNon.filter(n=>s.attendees.some(a=>a.memberId===n.id)).forEach(n=>S.members.push(n));
      if(isNew) S.sessions.push(s); else S.sessions[S.sessions.findIndex(x=>x.id===s.id)] = s;
      toast(isNew?"Class added":"Class saved");
    },
    onDelete: isNew?null:()=>{ S.sessions=S.sessions.filter(x=>x.id!==s.id); } });
  const add = (m, kind) => {
    if(s.attendees.some(a=>a.memberId===m.id)){ toast("Already checked in"); return; }
    if(!bkFor(s.id).some(b=>b.member_id===m.id) && slotsTaken(s)>=+S.settings.capacity) toast("Class is full. Check capacity.");
    s.typeId = val("s_type"); s.date = val("s_date") || s.date;
    const pr = priceFor(m, s, kind);
    s.attendees.push(Object.assign({memberId:m.id, name:m.name, kind, amount:Math.round(pr.amount*100)/100}, pr.pkg?{pkg:true}:{})); drawAtt();
  };
  document.getElementById("s_pct").oninput=e=>{ s.pctOverride=e.target.value; drawSum(); };
  document.getElementById("s_instr").onchange=e=>{ s.instructorId=e.target.value; document.getElementById("s_pctwrap").style.display = instRate(s).mode==="pct"?"":"none"; drawSum(); };
  document.getElementById("s_status").onchange=e=>{ s.instStatus=e.target.value; drawSum(); };
  document.getElementById("s_addm").onchange=e=>{ const m=member(e.target.value); e.target.value=""; if(m) add(m,"member"); };
  const bkBox=document.getElementById("s_bk"); if(bkBox) bkBox.onclick=e=>{ const b=e.target.closest("[data-bkadd]"); if(!b) return; const m=member(b.dataset.bkadd); if(m) add(m, m.type==="member"?"member":"nonmember"); else toast("This member isn't in your records anymore."); };
  document.getElementById("s_addn").onchange=e=>{ const m=member(e.target.value); e.target.value=""; if(m) add(m,"nonmember"); };
  document.getElementById("s_walk").onclick=()=>{
    const n=prompt("Walk-in name (saved as non-member)"); if(!n||!n.trim()) return;
    const c=prompt("Contact number (optional)")||"";
    const m={id:uid(), type:"nonmember", name:n.trim(), contact:c.trim(), notes:""}; newNon.push(m); add(m,"nonmember");
  };
  drawAtt();
}

/* ---------- scan a member card to record attendance ---------- */
function scanDlg(preId){
  const today = todayClasses();
  const pre = preId ? S.sessions.find(x=>x.id===preId) : null;
  const opts = pre && !today.includes(pre) ? [pre, ...today] : today;
  let selId = ((pre || nearestClass(today)) || {}).id || "";
  if(!opts.length){
    openDlg("Scan member card", `<div class="res warn" style="margin:0"><b class="t">No class today yet</b>
      <div class="small">Add today's class first. Then scan the cards.</div>
      <button type="button" class="btn sm" id="sc_add" style="margin-top:10px">Add today's class</button></div>`, {noFoot:true});
    document.getElementById("sc_add").onclick = ()=>sessionDlg();
    return;
  }
  openDlg("Scan member card", `
    <label class="f">Class<select id="sc_class">${opts.map(s=>`<option value="${s.id}" ${s.id===selId?"selected":""}>${esc(classLabel(s))}</option>`).join("")}</select></label>
    <div class="scanbox"><video id="sc_vid" playsinline muted></video><div class="aim"></div><div class="scanmsg" id="sc_msg">Opening the camera…</div></div>
    <div id="sc_res" role="status" aria-live="assertive"></div>
    <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="sc_no" class="sel" style="flex:1;min-width:0;font-weight:500" placeholder="Or type the member no." aria-label="Member no." autocomplete="off" autocapitalize="characters" enterkeyhint="go"><button type="button" class="btn sm" id="sc_go">Check in</button></div>
    <h3 style="margin:16px 0 4px" id="sc_cnt"></h3><div id="sc_list"></div>
    <button type="button" class="btn ghost" id="sc_done" style="width:100%;margin-top:14px">Done</button>`, {noFoot:true});
  const body = document.getElementById("dlgBody"), vid = document.getElementById("sc_vid"), msgEl = document.getElementById("sc_msg"), res = document.getElementById("sc_res");
  const cur = () => S.sessions.find(x=>x.id===selId);
  let alive = true, stream = null, timer = null, lastText = "", lastSeen = 0, ac = null;
  try{ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); }catch(e){}
  const buzz = ok => {
    try{ if(navigator.vibrate) navigator.vibrate(ok ? 70 : [60,50,60]); }catch(e){}
    try{ if(!ac) return; if(ac.state==="suspended") ac.resume();
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime, len=ok?.15:.3;
      o.frequency.value = ok ? 880 : 220; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+len);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+len+.02); }catch(e){}
  };
  const drawList = () => {
    const s = cur(), at = (s && s.attendees) || [];
    document.getElementById("sc_cnt").textContent = `Checked in (${at.length}/${S.settings.capacity})`;
    document.getElementById("sc_list").innerHTML = at.length ? `<ul class="list">${at.slice().reverse().map(a=>{ const m=member(a.memberId);
      return `<li style="padding:8px 0"><div class="row between"><span>${esc((m&&m.name)||a.name)} <span class="pill ${a.kind==="nonmember"?"":"pink"}">${a.kind==="nonmember"?"non-member":esc((m&&m.memberNo)||"member")}</span></span><span class="small muted">${a.at?fmtClock(a.at):""}</span></div></li>`; }).join("")}</ul>`
      : `<p class="small muted" style="margin:0">No one yet. Point the camera at a member card.</p>`;
  };
  const show = r => {
    res.innerHTML = `<div class="res ${r.cls||""}"><span class="t">${esc(r.title)}</span>
      ${r.m?`<div><b>${esc(r.m.name)}</b>${r.m.memberNo?` <span class="pill pink">${esc(r.m.memberNo)}</span>`:""}</div>`:""}
      ${r.text?`<div class="small">${esc(r.text)}</div>`:""}
      ${r.btn?`<button type="button" class="btn sm ${r.btn==="non"?"":"ghost"}" data-sc="${r.btn}" data-m="${r.m.id}" data-via="${r.via||"qr"}" style="margin-top:8px">${esc(r.btnLabel)}</button>`:""}</div>`;
    if(!r.quiet) buzz(r.cls==="ok");
    drawList();
  };
  const checkIn = (m, asNon, via) => {
    const s = cur();
    if(!s){ show({cls:"bad", title:"Pick a class first"}); return; }
    s.attendees = s.attendees || [];
    if(s.attendees.some(a=>a.memberId===m.id)){ show({cls:"warn", title:"Already checked in", m, text:classLabel(s)}); return; }
    const active = m.type==="member" && !cardExpired(m);
    if(!active && !asNon){
      show({cls:"bad", title: m.validUntil ? "Membership expired" : "Not an active member", m,
        text:(m.validUntil ? `Expired ${fmtDate(m.validUntil)}. ` : "")+"Not checked in.", via, btn:"non", btnLabel:`Check in as non-member (${peso(rate("nonMember"))})`});
      return;
    }
    const over = slotsTaken(s) > +S.settings.capacity;
    const pr = priceFor(m, s, active?"member":"nonmember");
    const amount = Math.round(pr.amount*100)/100;
    s.attendees.push(Object.assign({memberId:m.id, name:m.name, kind:active?"member":"nonmember", amount, via, at:new Date().toISOString()}, pr.pkg?{pkg:true}:{}));
    save();
    show({cls:"ok", title:"Checked in", m, text:`${classLabel(s)} · ${peso(amount)}${over?" · Class is over capacity":""}`, btn:"undo", btnLabel:"Undo"});
  };
  const onScan = text => {
    const m = findByCard(text);
    if(!m){ show({cls:"bad", title:"Not a Footwork PH card", text:"This QR code is not a member card from this studio."}); return; }
    checkIn(m, false, "qr");
  };
  const onTyped = () => {
    const el = document.getElementById("sc_no"), t = el.value.trim(); if(!t) return;
    const viaCard = findByCard(t), m = viaCard || findByNo(t);
    if(!m){ show({cls:"bad", title:"No member with that number", text:"Check the member no. on the card."}); return; }
    el.value = ""; checkIn(m, false, viaCard ? "qr" : "typed");
  };
  const stopCam = () => { clearTimeout(timer); timer = null; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } try{ vid.srcObject = null; }catch(e){} };
  const camMsg = (t, retry) => { msgEl.innerHTML = t ? `<span>${esc(t)}</span>${retry?`<button type="button" class="btn sm lime" data-sc="retry">Try again</button>`:""}` : ""; };
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
  const tick = () => {
    if(!alive) return;
    timer = setTimeout(tick, 110);
    if(document.hidden || vid.readyState < 2 || !vid.videoWidth) return;
    const k = Math.min(1, 720/Math.max(vid.videoWidth, vid.videoHeight));
    cv.width = Math.round(vid.videoWidth*k); cv.height = Math.round(vid.videoHeight*k);
    cx.drawImage(vid, 0, 0, cv.width, cv.height);
    let hit = null;
    try{ const d = cx.getImageData(0, 0, cv.width, cv.height); hit = jsQR(d.data, d.width, d.height, {inversionAttempts:"dontInvert"}); }catch(e){}
    if(!hit || !hit.data) return;
    const now = Date.now();
    /* the same card held in view counts once */
    if(hit.data===lastText && now-lastSeen < 2500){ lastSeen = now; return; }
    lastText = hit.data; lastSeen = now;
    onScan(hit.data);
  };
  const startCam = async () => {
    stopCam();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camMsg("This browser can't open the camera. Type the member no. below."); return; }
    camMsg("Opening the camera…");
    let st = null;
    try{ st = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
    catch(e){ if(alive) camMsg(e && (e.name==="NotAllowedError" || e.name==="SecurityError") ? "The camera is blocked. Allow the camera for this site, then tap Try again." : "Can't open the camera. Type the member no. below, or tap Try again.", true); return; }
    if(!alive){ st.getTracks().forEach(t=>t.stop()); return; }
    stream = st; vid.srcObject = st;
    try{ await vid.play(); }catch(e){}
    if(!alive) return;
    camMsg(""); tick();
  };
  dlgCleanup = () => { alive = false; stopCam(); try{ if(ac) ac.close(); }catch(e){} };
  body.onclick = e => {
    const b = e.target.closest("[data-sc]"); if(!b) return;
    const a = b.dataset.sc, m = b.dataset.m ? member(b.dataset.m) : null;
    if(a==="retry") startCam();
    else if(a==="non" && m) checkIn(m, true, b.dataset.via==="typed" ? "typed" : "qr");
    else if(a==="undo" && m){ const s = cur(); if(s){ s.attendees = (s.attendees||[]).filter(x=>x.memberId!==m.id); save(); } show({title:"Check-in removed", m, quiet:true}); }
  };
  document.getElementById("sc_class").onchange = e => { selId = e.target.value; res.innerHTML = ""; drawList(); };
  document.getElementById("sc_go").onclick = onTyped;
  document.getElementById("sc_no").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); onTyped(); } };
  document.getElementById("sc_done").onclick = ()=>dlg.close();
  drawList(); startCam();
}

  const weekTbl = span>7 && span<=62 ? breakdownTable(m.ses, s=>mondayOf(s.date), k=>`${shortD(k)} – ${shortD(addDays(k,6))}`, "Weekly breakdown") : "";

      <div class="row"><button type="button" class="btn sm" id="ip_sched">Schedule a class</button><button type="button" class="btn sm ghost" id="ip_edit">Edit details</button><button type="button" class="btn sm ghost" id="ip_contract">🖨 Contract</button></div>

    ${payFields(i,"ip")}
    <p class="small muted" style="margin:-4px 0 12px">Pay now: ${payLabel(i)}</p>
    ${periodBar()}
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><span>Commission earned</span><b class="money">${peso(m.earned)}</b></div>
      <div class="kpi"><span>Class sales</span><b class="money">${peso(m.sales)}</b></div>
      <div class="kpi"><span>Paid</span><b class="money" style="color:var(--good)">${peso(m.paid)}</b></div>
      <div class="kpi"><span>Pending</span><b class="money">${peso(m.pending)}</b></div>

      <div class="kpi"><span>Present / absent</span><b>${m.present} / ${m.absent}</b></div>
    </div>
    ${m.pending>0?`<button type="button" class="btn sm lime" id="ip_payall" style="margin-top:12px">Mark all pending as paid (${peso(m.pending)})</button>`:""}
    ${typeTbl}${monthTbl}${weekTbl}${dayTbl}
    <h3 style="margin:16px 0 6px">Classes</h3>
    ${m.ses.length?`<ul class="list">${m.ses.map(s=>{const c=sessionCalc(s);return `<li>
      <div class="row between"><div><b>${fmtDate(s.date)}</b> ${fmtTime(s.time)}<div class="small muted">${(s.attendees||[]).length} pax · sales ${peso(c.gross)} · ${c.mode==="pct"?`${c.pct}%${c.usedMin?" (min)":""}`:c.note}</div></div><b class="money">${peso(c.inst)}</b></div>
      <div class="row" style="margin-top:6px"><select class="sel" data-stype="${s.id}" aria-label="Class type">${typeOptions(s.typeId,"Class type…")}</select>${statusToggles(s)}</div></li>`;}).join("")}</ul>`:`<p class="empty">No classes in this period.</p>`}
  `, {noFoot:true});
  const body=document.getElementById("dlgBody");
  const upd=(k,v)=>{ i[k]= v===""?"":Math.max(0,k==="pct"?Math.min(100,+v):+v); save(); instrProfile(i); toast("Rate saved"); };

  document.getElementById("ip_rate").onchange=e=>upd("rate",e.target.value);

  document.getElementById("ip_contract").onclick=()=>printContract(instrDocData(i));

  const pa=document.getElementById("ip_payall"); if(pa) pa.onclick=()=>{ m.ses.forEach(s=>s.paidOut=true); save(); toast("All marked paid"); instrProfile(i); };

  };
}

      Object.assign(x,{name:val("it_name"), variant:val("it_var"), price:+val("it_price")||0, cost:+val("it_cost")||0, lowAt:+val("it_low")||0, memberOff:+val("it_moff")||0});
      if(isNew){ S.items.push(x); const q=+val("it_qty")||0; if(q>0) S.expenses.push({id:uid(), date:todayISO(), desc:x.name+" (stock)", category:"Merchandise", amount:q*x.cost, itemId:x.id, qty:q}); }
      toast(isNew?"Item added":"Item saved");
    },
    onDelete: isNew?null:()=>{ S.items=S.items.filter(y=>y.id!==x.id); } });
}
function sellDlg(x){
  const st=itemStock(x.id);
  const pct = Math.min(100, Math.max(0, +S.settings.merchDiscPct||0));
  const off = Math.max(0, +x.memberOff||0);
  const discLbl = off ? `${peso(off)} off each` : `${pct}% off`;
  const mems = S.members.filter(m=>m.type==="member").sort((a,b)=>(a.memberNo||"").localeCompare(b.memberNo||"",undefined,{numeric:true}));
  openDlg("Sell "+x.name, `
    <p class="small muted">In stock: <b>${st}</b></p>
    <div class="grid2">
      <label class="f">Quantity<input type="number" min="1" id="sl_qty" value="1"></label>
      <label class="f">Price each (₱)<input type="number" min="0" id="sl_price" value="${x.price}"></label>
      <label class="f">Date<input type="date" id="sl_date" value="${todayISO()}"></label>
      <label class="f">Member ID (${discLbl})<select id="sl_mem"><option value="">Not a member</option>${mems.map(m=>`<option value="${m.id}" ${cardExpired(m)?"disabled":""}>${esc(memLabel(m))}${cardExpired(m)?" (expired)":""}</option>`).join("")}</select></label>
    </div>
    <label class="f" id="sl_buyerWrap">Buyer (optional)<input id="sl_buyer"></label>
    ${mems.length?"":`<p class="small muted" style="margin-top:-4px">No members yet. Add members in Students to use the discount.</p>`}
    <div class="totbox" id="sl_tot"></div>`,
  { saveLabel:"Record sale", onSave:()=>{
      const q=+val("sl_qty")||0; if(q<=0){ toast("Enter a quantity"); return false; }
      if(q>st && !confirm(`Only ${st} in stock. Record anyway?`)) return false;
      const c=calc();
      S.sales.push({id:uid(), date:val("sl_date"), itemId:x.id, qty:q, price:+val("sl_price")||0, buyer:c.m?c.m.name:val("sl_buyer"),
        memberId:c.m?c.m.id:"", memberNo:c.m?(c.m.memberNo||""):"", discPct:c.m&&!off?pct:0, memberOff:c.m&&off?off:0, discount:c.disc});
      toast(c.disc?`Sale recorded with ${discLbl} member discount`:"Sale recorded");
    }});
  const calc=()=>{ const gross=(+val("sl_qty")||0)*(+val("sl_price")||0); const m=member(val("sl_mem"))||null; const q=+val("sl_qty")||0, pr=+val("sl_price")||0; const disc=!m?0:off?Math.min(pr,off)*q:Math.round(gross*pct)/100; return {gross, m, disc, total:gross-disc}; };
  const tot=()=>{ const c=calc(); document.getElementById("sl_buyerWrap").style.display=c.m?"none":"";
    document.getElementById("sl_tot").innerHTML = c.m
      ? `<div><span>Subtotal</span><span>${peso(c.gross)}</span></div><div><span>Member discount (${discLbl})</span><span style="color:var(--good)">− ${peso(c.disc)}</span></div><div class="big"><span>Total to collect</span><span>${peso(c.total)}</span></div>`
      : `<div class="big" style="margin-top:0"><span>Total to collect</span><span>${peso(c.gross)}</span></div>`; };
  ["sl_qty","sl_price"].forEach(id=>document.getElementById(id).oninput=tot);
  document.getElementById("sl_mem").onchange=tot; tot();
}
function restockDlg(x){
  openDlg("Restock "+x.name, `
    <div class="grid2">
      <label class="f">Quantity added<input type="number" min="1" id="rs_qty" value="10"></label>
      <label class="f">Cost per piece (₱)<input type="number" min="0" id="rs_cost" value="${x.cost}"></label>
      <label class="f">Date<input type="date" id="rs_date" value="${todayISO()}"></label>
    </div><p class="small" id="rs_tot"></p><p class="small muted">Logged as a Merchandise expense.</p>`,
  { saveLabel:"Add stock", onSave:()=>{
      const q=+val("rs_qty")||0, c=+val("rs_cost")||0; if(q<=0){ toast("Enter a quantity"); return false; }
      S.expenses.push({id:uid(), date:val("rs_date"), desc:x.name+" (stock)", category:"Merchandise", amount:q*c, itemId:x.id, qty:q}); toast("Stock added");
    }});
  const tot=()=>document.getElementById("rs_tot").innerHTML=`Total cost: <b>${peso((+val("rs_qty")||0)*(+val("rs_cost")||0))}</b>`;
  ["rs_qty","rs_cost"].forEach(id=>document.getElementById(id).oninput=tot); tot();
}

function expenseDlg(e){
  const isNew=!e; e = e || {id:uid(), date:todayISO(), desc:"", category:S.settings.categories[0]||"Other", amount:""};
  openDlg(isNew?"Add expense":"Edit expense", `
    <label class="f">Item<input id="e_desc" value="${esc(e.desc)}" placeholder="e.g. Rent"></label>
    <div class="grid2">
      <label class="f">Amount (₱)<input type="number" min="0" id="e_amt" value="${e.amount}"></label>
      <label class="f">Date<input type="date" id="e_date" value="${e.date}"></label>
      <label class="f">Category<select id="e_cat">${S.settings.categories.map(c=>`<option ${c===e.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
      ${e.itemId?`<label class="f">Stock quantity<input type="number" min="0" id="e_qty" value="${e.qty}"></label>`:""}
    </div>`,
  { onSave:()=>{
      const amt=+val("e_amt"); if(!val("e_desc")||!(amt>=0)||val("e_amt")===""){ toast("Enter item and amount"); return false; }
      Object.assign(e,{desc:val("e_desc"), amount:amt, date:val("e_date"), category:val("e_cat")});
      if(e.itemId) e.qty=+val("e_qty")||0;
      if(isNew) S.expenses.push(e); toast(isNew?"Expense added":"Expense saved");
    },
    onDelete: isNew?null:()=>{ S.expenses=S.expenses.filter(x=>x.id!==e.id); } });
}

function planDlg(p){
  const isNew=!p; p = p || {id:uid(), name:"", price:"", promoPrice:"", sessions:"", days:30, for:"member", typeIds:[]};
  const pt = p.typeIds||[];
  openDlg(isNew?"Add package":"Edit package", `
    <label class="f">Package name<input id="p_name" value="${esc(p.name)}" placeholder="e.g. 5 Sessions · Zumba (Member)"></label>
    <label class="f">For<select id="p_for"><option value="member" ${p.for!=="nonmember"&&p.for!==""?"selected":""}>Members</option><option value="nonmember" ${p.for==="nonmember"?"selected":""}>Non-members</option><option value="" ${p.for===""?"selected":""}>Anyone</option></select></label>
    <p class="flabel" id="p_typeLbl">Class types it covers (blank = any class)</p>
    <div class="checks" role="group" aria-labelledby="p_typeLbl">${S.settings.classTypes.map(t=>`<label><input type="checkbox" name="p_type" value="${t.id}" ${pt.includes(t.id)?"checked":""}>${esc(t.name)}</label>`).join("")}</div>
    <p class="small muted">The student picks ONE of these when they buy. Sessions only count in that class type.</p>
    <div class="grid2">
      <label class="f">Regular price (₱)<input type="number" min="0" id="p_price" value="${p.price}"></label>
      <label class="f">Promo price (₱)<input type="number" min="0" id="p_promo" value="${p.promoPrice}" placeholder="Optional"></label>
      <label class="f">Sessions included (0 = unlimited)<input type="number" min="0" id="p_ses" value="${p.sessions}"></label>
      <label class="f">Valid for (days)<input type="number" min="1" id="p_days" value="${p.days}"></label>
    </div>`,
  { onSave:()=>{
      if(!val("p_name")){ toast("Enter a package name"); return false; }
      const pr=val("p_promo");
      Object.assign(p,{name:val("p_name"), price:+val("p_price")||0, promoPrice:pr===""?"":+pr, sessions:+val("p_ses")||0, days:+val("p_days")||30,
        for:val("p_for"), typeIds:[...document.querySelectorAll('input[name="p_type"]:checked')].map(x=>x.value)});
      if(isNew) S.settings.plans.push(p);
    },
    onDelete: isNew?null:()=>{ S.settings.plans=S.settings.plans.filter(x=>x.id!==p.id); } });
}

/* ---------- events ---------- */
function handleAct(b){
  const id=b.dataset.id, a=b.dataset.act;
  const ses = () => S.sessions.find(x=>x.id===id);
  const reRender = () => { if(!dlg.open) render(); };
  if(a==="newSession") sessionDlg();
  else if(a==="bkMsg"){ const b=BK.find(x=>x.id===id); if(b) copyText(bkConfText(b),"Message copied. Paste it in Messenger."); }
  else if(a==="bkRemind"){ const bk=BK.find(x=>x.id===id); if(bk){ b.disabled=true; b.textContent="Sending…"; bkSendRem(bk).then(r=>{ if(r==="sent") bkMarkReminded(bk); toast(r==="sent"?"Reminder sent to "+bkEmailOf(bk):r==="noemail"?"No email on file. Use Copy reminder.":r==="nomail"?"Email not set up. Use Copy reminder.":"Email failed. Use Copy reminder."); render(); }); } }
  else if(a==="bkRemindCopy"){ const b=BK.find(x=>x.id===id); if(b){ copyText(bkRemText(b),"Reminder copied. Paste it in Messenger."); bkMarkReminded(b); render(); } }
  else if(a==="bkResend"){ const b=BK.find(x=>x.id===id); if(b) bkSendConf(b).then(r=>toast(r==="sent"?"Email sent":r==="noemail"?"No email on file. Use Copy message.":"Email failed. Use Copy message.")); }
  else if(a==="bkConfirm") bkSet(id,{status:"confirmed"},"Booking confirmed");
  else if(a==="bkUnconfirm") bkSet(id,{status:"pending"},"Back to waiting for payment");
  else if(a==="bkCancel"){ if(confirm("Cancel this booking? The slot opens up for other members.")) bkSet(id,{status:"cancelled",cancelled_by:"studio"},"Booking cancelled"); }
  else if(a==="bkProof") bkProof(id);
  else if(a==="bkCopy") copyText(BOOK_URL,"Booking link copied");
  else if(a==="bkRefresh") loadBookings().then(()=>{ render(); toast("Bookings updated"); });
  else if(a==="editSession") sessionDlg(ses());
  else if(a==="schedFor") sessionDlg(null,{instructorId:id});
  else if(a==="calAdd") sessionDlg(null,{date:b.dataset.date});
  else if(a==="calNav"){ const v=+b.dataset.v; calWeek = v ? addDays(curWeek(),7*v) : sundayOf(todayISO()); render(); }
  else if(a==="copyWeek") copyLastWeek();
  else if(a==="copyViber"){ const ws=curWeek(); if(!weekSessions(ws).length) toast("No classes this week yet"); else copyText(schedText(ws),"Schedule copied. Paste it in Viber."); }
  else if(a==="sendSched") sendSchedDlg();
  else if(a==="sendNon") sendNonDlg();
  else if(a==="copyScript") copyText(mailScript(),"Script copied");
  else if(a==="mailTest") mailTest();
  else if(a==="setStatus"){ ses().instStatus=b.dataset.v; save(); toast(b.dataset.v==="absent"?"Marked absent":"Marked present"); reRender(); }
  else if(a==="setPaid"){ ses().paidOut=b.dataset.v==="1"; save(); toast(b.dataset.v==="1"?"Marked paid":"Marked pending"); reRender(); }
  else if(a==="newMember") personDlg(null,"member");
  else if(a==="newNon") personDlg(null,"nonmember");
  else if(a==="editPerson") personDlg(member(id));
  else if(a==="printContract") printContract(member(id));
  else if(a==="printCard") printCards([member(id)]);
  else if(a==="printConsent") printContract(consentDocData(member(id)));
  else if(a==="printWaiver") printContract(waiverDocData(member(id)));
  else if(a==="printInstrContract"){ const i=instr(id); if(i) printContract(instrDocData(i)); }
  else if(a==="newExpense") expenseDlg();
  else if(a==="editExpense") expenseDlg(S.expenses.find(x=>x.id===id));
  else if(a==="newPlan") planDlg();
  else if(a==="editPlan") planDlg(plan(id));
  else if(a==="newInstr") instrDlg();
  else if(a==="openInstr") instrProfile(instr(id));
  else if(a==="newType") typeDlg();
  else if(a==="editType") typeDlg(ctype(id));
  else if(a==="newRental") rentalDlg();
  else if(a==="editRental") rentalDlg(S.rentals.find(x=>x.id===id));
  else if(a==="rentStatus"){ const x=S.rentals.find(y=>y.id===id); x.status=b.dataset.v; save(); toast("Marked "+b.dataset.v); reRender(); }
  else if(a==="newItem") itemDlg();
  else if(a==="editItem") itemDlg(item(id));
  else if(a==="sellItem") sellDlg(item(id));
  else if(a==="restock") restockDlg(item(id));
  else if(a==="scan") scanDlg();
  else if(a==="scanFor") scanDlg(id);
  else if(a==="qrZip") downloadAllQr();
  else if(a==="cardsPick") pickCards();
  else if(a==="delSale"){ if(confirm("Delete this sale?")){ S.sales=S.sales.filter(x=>x.id!==id); save(); render(); toast("Sale deleted"); } }
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
const view=document.getElementById("view");
view.addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"); if(go){ tab=go.dataset.go; render(); window.scrollTo(0,0); return; }
  const pe=e.target.closest("[data-pmode],[data-pnav]"); if(pe){ if(periodEvent(pe,"click")) render(); return; }
  const cv=e.target.closest("[data-cview]"); if(cv){ classView=cv.dataset.cview; lsSet("fw-cview",classView); render(); return; }
  const sg=e.target.closest("[data-seg]"); if(sg){ peopleSeg=sg.dataset.seg; render(); return; }
  const b=e.target.closest("[data-act]"); if(b) handleAct(b);
});
view.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.pin){ if(periodEvent(t,"change")) render(); return; }
  if(t.id==="ctf"){ classTypeFilter=t.value; render(); return; }
  if(t.hasAttribute("data-calpick")){ if(t.value){ calWeek=sundayOf(t.value); render(); } return; }
  if(t.hasAttribute("data-mailurl")){ S.settings.mail.url=t.value.trim(); save(); render(); toast(mailReady()?"URL saved. Tap Test.":"That URL should end in /exec"); return; }
  if(t.hasAttribute("data-promo")){ S.settings.promo.active=t.checked; save(); render(); toast(t.checked?"Promo rates ON":"Regular rates ON"); return; }
  if(t.hasAttribute("data-promoends")){ S.settings.promo.ends=t.value; save(); render(); toast("Promo end saved"); return; }
  if(t.dataset.rate){ const [k,f]=t.dataset.rate.split("."); S.settings.rates[k][f]= f==="promo"&&t.value===""?"":Math.max(0,+t.value||0); save(); render(); toast("Rate saved"); return; }
  if(t.dataset.rent){ S.settings.rental[t.dataset.rent]=Math.max(0,+t.value||0); save(); render(); toast("Rental rate saved"); return; }
  if(t.dataset.pct){ const s=S.sessions.find(x=>x.id===t.dataset.pct); s.pctOverride = t.value===""?"":Math.max(0,Math.min(100,+t.value)); save(); render(); toast("Split updated for this class"); return; }
  const k=t.dataset.set; if(!k) return;
  let v=t.value;
  if(k==="categories") v=v.split(",").map(x=>x.trim()).filter(Boolean);
  else if(k==="studioPct"){ S.settings.instructorPct=100-Math.min(100,Math.max(0,+v||0)); save(); render(); toast("Split saved"); return; }
  else if(k!=="studioName") v=Math.max(0,+v||0);
  if(k==="instructorPct"||k==="merchDiscPct") v=Math.min(100,v);
  S.settings[k]=v; save(); render(); toast("Settings saved");
});
view.addEventListener("input", e=>{
  if(e.target.id==="mq"){ peopleQ=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById("mq"); el.focus(); el.setSelectionRange(pos,pos); }
});

document.getElementById("bell").onclick = bellDlg;
document.getElementById("scanBtn").onclick = ()=>scanDlg();
view.addEventListener("click", e=>{ const c = e.target.closest("[data-copy]"); if(c) copyInterest(c.dataset.copy); });
view.addEventListener("toggle", e=>{
  const d = e.target; if(!d.dataset || !d.dataset.isum) return;
  if(d.open) interestOpen.add(d.dataset.isum); else interestOpen.delete(d.dataset.isum);
}, true);
view.addEventListener("click", e=>{
  const b = e.target.closest("[data-sb]"); if(!b) return;
  if(b.dataset.sb==="sync"){ if(sbUser) syncTick(true); else toast("You are offline."); }
  else if(b.dataset.sb==="out"){ if(sbUser) signOut(); else toast("You are offline."); }
});
init();
})();
</script>
</body>
</html>
